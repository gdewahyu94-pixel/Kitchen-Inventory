<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kitchen Inventory</title>
<style>
:root{--bg:#f4f5f3;--card:#fff;--ink:#1d2621;--mute:#6a756e;--line:#e1e5e1;--pri:#1f6f54;--pri2:#e5f1ec;--red:#c0392b;--red2:#fbecea;--amb:#b26b00;--amb2:#fdf3e1}
*{box-sizing:border-box}
body{margin:0;font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
.top{position:sticky;top:0;z-index:5}
header{background:var(--pri);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:17px;margin:0}header small{opacity:.8;font-size:12px}
.icon{background:rgba(255,255,255,.15);border:0;color:#fff;font-size:18px;width:36px;height:36px;border-radius:8px;cursor:pointer}
nav{display:flex;background:#fff;border-bottom:1px solid var(--line)}
nav button{flex:1;border:0;background:none;padding:12px 4px;font:inherit;font-size:14px;color:var(--mute);border-bottom:3px solid transparent;cursor:pointer}
nav button.on{color:var(--pri);border-color:var(--pri);font-weight:600}
main{max-width:900px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.stat small{color:var(--mute);font-size:12px}.stat b{display:block;font-size:24px;margin-top:2px}
.stat.r b{color:var(--red)}.stat.a b{color:var(--amb)}.stat.g b{color:var(--pri)}
h3{margin:0 0 10px;font-size:15px}h4{margin:18px 0 8px;font-size:14px}
.bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.bar input,.bar select{flex:1;min-width:130px;width:auto}
input,select,textarea{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:12px}
label input,label select,label textarea{margin-top:4px}
.btn{border:0;border-radius:8px;padding:10px 14px;font:inherit;font-weight:600;background:var(--pri);color:#fff;cursor:pointer;white-space:nowrap}
.btn.red{background:var(--red)}.btn.amb{background:var(--amb)}.btn.ghost{background:var(--pri2);color:var(--pri)}
.btn.full{width:100%}.btn:disabled{opacity:.6}
.item,.log{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.item{cursor:pointer}
.th{width:56px;height:56px;border-radius:8px;object-fit:cover;flex:none;background:var(--pri2)}
.th.sm{width:44px;height:44px}
.ph{display:flex;align-items:center;justify-content:center;font-size:22px}
.info{flex:1;min-width:0}.meta{color:var(--mute);font-size:12px;margin-top:2px}
.qty{text-align:center;font-size:22px;font-weight:700;color:var(--pri);min-width:60px}
.qty small{display:block;font-size:11px;font-weight:500;color:var(--mute)}
.qty.low{color:var(--red)}
.seg{display:flex;gap:6px;margin-bottom:14px}
.seg button{flex:1;padding:10px;border:1px solid var(--line);background:#fff;border-radius:8px;font:inherit;cursor:pointer;color:var(--mute)}
.seg button.on[data-t=BROKEN]{background:var(--red2);border-color:var(--red);color:var(--red);font-weight:600}
.seg button.on[data-t=LOST]{background:var(--amb2);border-color:var(--amb);color:var(--amb);font-weight:600}
.seg button.on[data-t=ADD]{background:var(--pri2);border-color:var(--pri);color:var(--pri);font-weight:600}
.hint{font-size:13px;margin:-6px 0 12px;color:var(--mute)}
.prev{max-width:160px;border-radius:8px;margin-bottom:12px;display:block}
.tag{font-size:11px;font-weight:700;padding:4px 6px;border-radius:6px;flex:none;width:72px;text-align:center}
.t-BROKEN{background:var(--red2);color:var(--red)}.t-LOST{background:var(--amb2);color:var(--amb)}
.t-ADD,.t-NEWITEM{background:var(--pri2);color:var(--pri)}
.q{font-weight:700}
.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}.row:last-child{border:0}
.empty{color:var(--mute);text-align:center;padding:20px;font-size:14px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.modal[hidden]{display:none}
.sheet{background:#fff;width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
@media(min-width:600px){.modal{align-items:center}.sheet{border-radius:16px}}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.mh h3{margin:0;font-size:17px}
.x{border:0;background:var(--bg);width:32px;height:32px;border-radius:8px;cursor:pointer}
.big{width:100%;max-height:260px;object-fit:contain;background:var(--bg);border-radius:10px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:8px;margin-bottom:12px}
.grid div{background:var(--bg);border-radius:8px;padding:8px;text-align:center}
.grid small{color:var(--mute);font-size:11px;display:block}.grid b{font-size:18px}
.acts{display:flex;gap:8px;margin-bottom:14px}.acts .btn{flex:1}
#toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,120px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;transition:.25s;z-index:20;font-size:14px;max-width:90vw}
#toast.show{transform:translate(-50%,0)}#toast.err{background:var(--red)}
</style>
</head>
<body>
<div class="top">
  <header>
    <div><h1>Kitchen Inventory</h1><small id="sub">Inventory · Lost · Breakage</small></div>
    <button class="icon" id="refresh" title="Refresh">↻</button>
  </header>
  <nav>
    <button data-tab="dash" class="on">Dashboard</button>
    <button data-tab="inv">Inventory</button>
    <button data-tab="rep">Report</button>
    <button data-tab="his">History</button>
  </nav>
</div>

<main>
  <section id="dash"><p class="empty">Loading...</p></section>

  <section id="inv" hidden>
    <div class="bar">
      <input id="q" placeholder="Search item...">
      <select id="sort">
        <option value="no">Sheet order</option>
        <option value="name">Name A–Z</option>
        <option value="low">Lowest stock</option>
        <option value="broken">Most broken/lost</option>
      </select>
      <button class="btn" id="newBtn">+ New item</button>
    </div>
    <div id="list"></div>
  </section>

  <section id="rep" hidden>
    <form id="repForm" class="card">
      <div class="seg" id="seg">
        <button type="button" data-t="BROKEN" class="on">Broken</button>
        <button type="button" data-t="LOST">Lost</button>
        <button type="button" data-t="ADD">Add stock</button>
      </div>
      <label>Item<select id="rItem" required></select></label>
      <div id="rInfo" class="hint"></div>
      <label>Quantity<input id="rQty" type="number" min="1" step="1" inputmode="numeric" required></label>
      <label>Reported by<input id="rBy" required></label>
      <label>Note<textarea id="rNote" rows="2" placeholder="e.g. dropped during dinner service"></textarea></label>
      <label>Photo (optional)<input id="rPhoto" type="file" accept="image/*" capture="environment"></label>
      <img id="rPrev" class="prev" hidden>
      <button class="btn full red" id="rSubmit">Report broken</button>
    </form>
  </section>

  <section id="his" hidden>
    <div class="bar">
      <select id="hType">
        <option value="">All types</option><option>BROKEN</option><option>LOST</option>
        <option>ADD</option><option>NEW ITEM</option>
      </select>
      <input id="hMonth" type="month">
    </div>
    <div id="hList"></div>
  </section>
</main>

<div id="modal" class="modal" hidden><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>

<script>
const API = 'PASTE_APPS_SCRIPT_WEB_APP_URL_HERE';

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S = { items: [], log: [], hasLost: false, low: 5, pin: false, type: 'BROKEN' };

/* ---------- API ---------- */
async function get(action, params = {}) {
  const u = new URL(API);
  u.searchParams.set('action', action);
  for (const k in params) u.searchParams.set(k, params[k]);
  const j = await (await fetch(u)).json();
  if (!j.ok) throw new Error(j.error);
  return j.data;
}
async function post(body) {
  if (S.pin && !localStorage.getItem('inv_pin')) {
    const p = prompt('Enter PIN');
    if (!p) throw new Error('PIN required');
    localStorage.setItem('inv_pin', p);
  }
  body.pin = localStorage.getItem('inv_pin') || '';
  body.by = body.by || localStorage.getItem('inv_by') || '';
  const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  const j = await r.json();
  if (!j.ok) { if (j.error === 'Wrong PIN') localStorage.removeItem('inv_pin'); throw new Error(j.error); }
  return j.data;
}

/* ---------- UTILS ---------- */
function toast(m, err) {
  const t = $('#toast'); t.textContent = m; t.className = 'show' + (err ? ' err' : '');
  clearTimeout(t._t); t._t = setTimeout(() => t.className = '', 3000);
}
function noImg(el) { const d = document.createElement('div'); d.className = el.className + ' ph'; d.textContent = '🍽'; el.replaceWith(d); }
function thumb(src, cls = 'th') {
  return src ? `<img class="${cls}" src="${esc(src)}" loading="lazy" referrerpolicy="no-referrer" onerror="noImg(this)">`
             : `<div class="${cls} ph">🍽</div>`;
}
const byRow = r => S.items.find(i => i.row == r);
function thisMonth() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
function compress(file) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, 1000 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = img.width * s; c.height = img.height * s;
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      res(c.toDataURL('image/jpeg', 0.75));
    };
    img.onerror = rej;
    img.src = URL.createObjectURL(file);
  });
}

/* ---------- LOAD ---------- */
async function load() {
  $('#sub').textContent = 'Loading...';
  try {
    const [inv, log] = await Promise.all([get('list'), get('log', { limit: 1000 })]);
    S.items = inv.items; S.hasLost = inv.hasLost; S.low = inv.lowStock; S.pin = inv.pinRequired; S.log = log;
    renderDash(); renderList(); fillSelect(); renderHis();
    $('#sub').textContent = 'Updated ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  } catch (e) { toast(e.message, 1); $('#sub').textContent = 'Failed to load'; }
}

/* ---------- DASHBOARD ---------- */
function renderDash() {
  const m = S.log.filter(l => l.ts.startsWith(thisMonth()));
  const sum = t => m.filter(l => l.type === t).reduce((a, l) => a + l.qty, 0);
  const stock = S.items.reduce((a, i) => a + i.closing, 0);
  const low = S.items.filter(i => i.closing <= S.low).sort((a, b) => a.closing - b.closing);
  const top = {};
  m.filter(l => l.type === 'BROKEN' || l.type === 'LOST').forEach(l => top[l.item] = (top[l.item] || 0) + l.qty);
  const topList = Object.entries(top).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const monthName = new Date().toLocaleString('en', { month: 'long', year: 'numeric' });

  $('#dash').innerHTML = `
    <div class="stats">
      <div class="stat"><small>Items</small><b>${S.items.length}</b></div>
      <div class="stat g"><small>Stock on hand</small><b>${stock}</b></div>
      <div class="stat r"><small>Broken · ${monthName}</small><b>${sum('BROKEN')}</b></div>
      <div class="stat a"><small>Lost · ${monthName}</small><b>${sum('LOST')}</b></div>
      <div class="stat g"><small>Added · ${monthName}</small><b>${sum('ADD')}</b></div>
    </div>
    <div class="card"><h3>Low stock (≤ ${S.low})</h3>
      ${low.length ? low.map(i => `<div class="row"><span>${esc(i.item)}</span><b style="color:var(--red)">${i.closing}</b></div>`).join('') : '<p class="empty">All items above minimum</p>'}
    </div>
    <div class="card"><h3>Most broken / lost this month</h3>
      ${topList.length ? topList.map(([n, q]) => `<div class="row"><span>${esc(n)}</span><b>${q}</b></div>`).join('') : '<p class="empty">Nothing reported this month</p>'}
    </div>`;
}

/* ---------- INVENTORY ---------- */
function renderList() {
  const q = $('#q').value.toLowerCase().trim(), sort = $('#sort').value;
  let a = S.items.filter(i => i.item.toLowerCase().includes(q));
  if (sort === 'name') a.sort((x, y) => x.item.localeCompare(y.item));
  if (sort === 'low') a.sort((x, y) => x.closing - y.closing);
  if (sort === 'broken') a.sort((x, y) => (y.broken + y.lost) - (x.broken + x.lost));
  $('#list').innerHTML = a.length ? a.map(i => {
    const low = i.closing <= S.low;
    return `<div class="item" onclick="openItem(${i.row})">${thumb(i.photo)}
      <div class="info"><b>${esc(i.item)}</b>
        <div class="meta">Awal ${i.awal} · +${i.add} · Broken ${i.broken}${S.hasLost ? ' · Lost ' + i.lost : ''}</div>
        ${i.remarks ? `<div class="meta">${esc(i.remarks)}</div>` : ''}
      </div>
      <div class="qty ${low ? 'low' : ''}">${i.closing}<small>${low ? 'low' : 'in stock'}</small></div></div>`;
  }).join('') : '<p class="empty">No items found</p>';
}

function openModal(html) { $('#sheet').innerHTML = html; $('#modal').hidden = false; }
function closeModal() { $('#modal').hidden = true; }
$('#modal').onclick = e => { if (e.target.id === 'modal') closeModal(); };

function openItem(row) {
  const i = byRow(row); if (!i) return;
  const h = S.log.filter(l => l.item === i.item).slice(0, 10);
  openModal(`
    <div class="mh"><h3>${esc(i.item)}</h3><button class="x" onclick="closeModal()">✕</button></div>
    ${i.photo ? `<img class="big" src="${esc(i.photo)}" referrerpolicy="no-referrer" onerror="this.remove()">` : ''}
    <div class="grid">
      <div><small>Stock awal</small><b>${i.awal}</b></div>
      <div><small>Additional</small><b>${i.add}</b></div>
      <div><small>Broken</small><b>${i.broken}</b></div>
      ${S.hasLost ? `<div><small>Lost</small><b>${i.lost}</b></div>` : ''}
      <div><small>Closing</small><b>${i.closing}</b></div>
    </div>
    <div class="acts">
      <button class="btn red" onclick="goReport(${i.row},'BROKEN')">Broken</button>
      <button class="btn amb" onclick="goReport(${i.row},'LOST')">Lost</button>
      <button class="btn" onclick="goReport(${i.row},'ADD')">Add stock</button>
    </div>
    <label>Remarks<input id="eRem" value="${esc(i.remarks)}"></label>
    <label>Change photo<input id="ePhoto" type="file" accept="image/*" capture="environment"></label>
    <button class="btn full ghost" id="eSave" onclick="saveEdit(${i.row})">Save changes</button>
    <h4>Recent history</h4>
    ${h.length ? h.map(logRow).join('') : '<p class="empty">No history yet</p>'}`);
}

async function saveEdit(row) {
  const i = byRow(row), btn = $('#eSave'), f = $('#ePhoto').files[0];
  btn.disabled = true; btn.textContent = 'Saving...';
  try {
    await post({ action: 'updateItem', row, item: i.item, remarks: $('#eRem').value.trim(), photo: f ? await compress(f) : '' });
    toast('Saved'); closeModal(); load();
  } catch (e) { toast(e.message, 1); btn.disabled = false; btn.textContent = 'Save changes'; }
}

$('#newBtn').onclick = () => openModal(`
  <div class="mh"><h3>New item</h3><button class="x" onclick="closeModal()">✕</button></div>
  <label>Item name<input id="nName"></label>
  <label>Stock awal<input id="nAwal" type="number" min="0" step="1" inputmode="numeric" value="0"></label>
  <label>Remarks<input id="nRem"></label>
  <label>Photo<input id="nPhoto" type="file" accept="image/*" capture="environment"></label>
  <button class="btn full" id="nSave" onclick="saveNew()">Add item</button>`);

async function saveNew() {
  const name = $('#nName').value.trim(); if (!name) return toast('Item name is required', 1);
  const btn = $('#nSave'), f = $('#nPhoto').files[0];
  btn.disabled = true; btn.textContent = 'Saving...';
  try {
    await post({ action: 'addItem', item: name, awal: +$('#nAwal').value || 0, remarks: $('#nRem').value.trim(), photo: f ? await compress(f) : '' });
    toast('Item added'); closeModal(); load();
  } catch (e) { toast(e.message, 1); btn.disabled = false; btn.textContent = 'Add item'; }
}

/* ---------- REPORT ---------- */
function fillSelect() {
  const s = $('#rItem'), v = s.value;
  s.innerHTML = '<option value="">— choose item —</option>' +
    [...S.items].sort((a, b) => a.item.localeCompare(b.item)).map(i => `<option value="${i.row}">${esc(i.item)}</option>`).join('');
  s.value = v; showInfo();
}
function showInfo() { const i = byRow($('#rItem').value); $('#rInfo').innerHTML = i ? `Current stock: <b>${i.closing}</b>` : ''; }
function setType(t) {
  S.type = t;
  document.querySelectorAll('#seg button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  const btn = $('#rSubmit');
  btn.textContent = t === 'ADD' ? 'Add stock' : t === 'LOST' ? 'Report lost' : 'Report broken';
  btn.className = 'btn full ' + (t === 'ADD' ? '' : t === 'LOST' ? 'amb' : 'red');
}
function goReport(row, t) { closeModal(); tab('rep'); setType(t); $('#rItem').value = row; showInfo(); $('#rQty').focus(); }

document.querySelectorAll('#seg button').forEach(b => b.onclick = () => setType(b.dataset.t));
$('#rItem').onchange = showInfo;
$('#rPhoto').onchange = e => { const f = e.target.files[0], p = $('#rPrev'); if (f) { p.src = URL.createObjectURL(f); p.hidden = false; } else p.hidden = true; };

$('#repForm').onsubmit = async e => {
  e.preventDefault();
  const i = byRow($('#rItem').value); if (!i) return toast('Choose an item', 1);
  const qty = +$('#rQty').value;
  if (S.type !== 'ADD' && qty > i.closing) return toast('Quantity is more than current stock (' + i.closing + ')', 1);
  const by = $('#rBy').value.trim(); localStorage.setItem('inv_by', by);
  const btn = $('#rSubmit'), f = $('#rPhoto').files[0];
  btn.disabled = true; btn.textContent = 'Saving...';
  try {
    await post({ action: 'movement', type: S.type, row: i.row, item: i.item, qty, by, note: $('#rNote').value.trim(), photo: f ? await compress(f) : '' });
    toast('Saved');
    $('#rQty').value = ''; $('#rNote').value = ''; $('#rPhoto').value = ''; $('#rPrev').hidden = true;
    await load();
  } catch (err) { toast(err.message, 1); }
  finally { btn.disabled = false; setType(S.type); }
};

/* ---------- HISTORY ---------- */
function logRow(l) {
  const sign = (l.type === 'ADD' || l.type === 'NEW ITEM') ? '+' : (l.type === 'BROKEN' || l.type === 'LOST') ? '−' : '';
  return `<div class="log"><span class="tag t-${l.type.replace(/\s/g, '')}">${esc(l.type)}</span>
    <div class="info"><b>${esc(l.item)}</b> <span class="q">${sign}${l.qty}</span>
      <div class="meta">${esc(l.ts)} · ${esc(l.by || '-')}${l.note ? ' · ' + esc(l.note) : ''}</div></div>
    ${l.photo ? `<a href="${esc(l.photo)}" target="_blank">${thumb(l.photo, 'th sm')}</a>` : ''}</div>`;
}
function renderHis() {
  const t = $('#hType').value, m = $('#hMonth').value;
  const a = S.log.filter(l => (!t || l.type === t) && (!m || l.ts.startsWith(m)));
  $('#hList').innerHTML = a.length ? a.map(logRow).join('') : '<p class="empty">No records</p>';
}

/* ---------- TABS & INIT ---------- */
function tab(t) {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  document.querySelectorAll('main section').forEach(s => s.hidden = s.id !== t);
  scrollTo(0, 0);
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => tab(b.dataset.tab));
$('#q').oninput = renderList; $('#sort').onchange = renderList;
$('#hType').onchange = renderHis; $('#hMonth').onchange = renderHis;
$('#refresh').onclick = load;
$('#rBy').value = localStorage.getItem('inv_by') || '';
$('#hMonth').value = thisMonth();
load();
</script>
</body>
</html>
