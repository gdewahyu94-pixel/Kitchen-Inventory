<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kitchen Inventory</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f4f5f3;--card:#fff;--ink:#1d2621;--mute:#6a756e;--line:#e1e5e1;--pri:#1f6f54;--pri2:#e5f1ec;--red:#c0392b;--red2:#fbecea;--amb:#b26b00;--amb2:#fdf3e1;--blu:#2b5797;--blu2:#e8eef7}
*{box-sizing:border-box}
body{margin:0;font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
.top{position:sticky;top:0;z-index:5}
header{background:var(--pri);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:17px;margin:0}header small{opacity:.8;font-size:12px}
.icon{background:rgba(255,255,255,.15);border:0;color:#fff;font-size:18px;width:36px;height:36px;border-radius:8px;cursor:pointer}
nav{display:flex;background:#fff;border-bottom:1px solid var(--line)}
nav button{flex:1;border:0;background:none;padding:12px 2px;font:inherit;font-size:13px;color:var(--mute);border-bottom:3px solid transparent;cursor:pointer}
nav button.on{color:var(--pri);border-color:var(--pri);font-weight:600}
main{max-width:900px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.stat small{color:var(--mute);font-size:12px}.stat b{display:block;font-size:22px;margin-top:2px}
.stat.r b{color:var(--red)}.stat.a b{color:var(--amb)}.stat.g b{color:var(--pri)}
h3{margin:0 0 10px;font-size:15px}h4{margin:18px 0 8px;font-size:14px}
.bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.bar input,.bar select{flex:1;min-width:130px;width:auto}
input,select,textarea{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:12px}
label input,label select,label textarea{margin-top:4px}
.btn{border:0;border-radius:8px;padding:10px 14px;font:inherit;font-weight:600;background:var(--pri);color:#fff;cursor:pointer;white-space:nowrap}
.btn.red{background:var(--red)}.btn.amb{background:var(--amb)}.btn.ghost{background:var(--pri2);color:var(--pri)}
.btn.full{width:100%}.btn:disabled{opacity:.6}
.item,.log{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.item{cursor:pointer}
.th{width:56px;height:56px;border-radius:8px;object-fit:cover;flex:none;background:var(--pri2)}
.th.sm{width:44px;height:44px}
.ph{display:flex;align-items:center;justify-content:center;font-size:22px}
.info{flex:1;min-width:0}.meta{color:var(--mute);font-size:12px;margin-top:2px}
.qty{text-align:center;font-size:22px;font-weight:700;color:var(--pri);min-width:60px}
.qty small{display:block;font-size:11px;font-weight:500;color:var(--mute)}
.qty.low{color:var(--red)}
.seg{display:flex;gap:6px;margin-bottom:14px}
.seg button{flex:1;padding:10px;border:1px solid var(--line);background:#fff;border-radius:8px;font:inherit;cursor:pointer;color:var(--mute)}
.seg button.on[data-t=BROKEN]{background:var(--red2);border-color:var(--red);color:var(--red);font-weight:600}
.seg button.on[data-t=LOST]{background:var(--amb2);border-color:var(--amb);color:var(--amb);font-weight:600}
.seg button.on[data-t=ADD]{background:var(--pri2);border-color:var(--pri);color:var(--pri);font-weight:600}
.hint{font-size:13px;margin:-6px 0 12px;color:var(--mute)}
.note{font-size:13px;color:var(--ink);background:var(--bg);border-radius:8px;padding:12px;margin-bottom:12px;line-height:1.5}
.prev{max-width:160px;border-radius:8px;margin-bottom:12px;display:block}
.tag{font-size:11px;font-weight:700;padding:4px 6px;border-radius:6px;flex:none;width:72px;text-align:center}
.t-BROKEN{background:var(--red2);color:var(--red)}.t-LOST{background:var(--amb2);color:var(--amb)}
.t-ADD,.t-NEWITEM{background:var(--pri2);color:var(--pri)}.t-CLOSEMONTH{background:var(--blu2);color:var(--blu)}
.q{font-weight:700}
.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}.row:last-child{border:0}
.row span:last-child{text-align:right;white-space:nowrap}
.empty{color:var(--mute);text-align:center;padding:20px;font-size:14px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.modal[hidden]{display:none}
.sheet{background:#fff;width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
@media(min-width:600px){.modal{align-items:center}.sheet{border-radius:16px}}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.mh h3{margin:0;font-size:17px}
.x{border:0;background:var(--bg);width:32px;height:32px;border-radius:8px;cursor:pointer}
.big{width:100%;max-height:260px;object-fit:contain;background:var(--bg);border-radius:10px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:8px;margin-bottom:12px}
.grid div{background:var(--bg);border-radius:8px;padding:8px;text-align:center}
.grid small{color:var(--mute);font-size:11px;display:block}.grid b{font-size:16px}
.acts{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}.acts .btn{flex:1}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.flex{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,120px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;transition:.25s;z-index:20;font-size:14px;max-width:90vw}
#toast.show{transform:translate(-50%,0)}#toast.err{background:var(--red)}
/* Recap report */
.tbl-wrap{overflow-x:auto;margin-bottom:16px}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th,.tbl td{border:1px solid #cfd6d1;padding:5px 6px;text-align:left;vertical-align:top}
.tbl th{background:var(--pri2);font-weight:600;white-space:nowrap}
.tbl .n{text-align:right;white-space:nowrap}
.tbl tfoot td{font-weight:700;background:var(--bg)}
.rh{text-align:center;margin-bottom:14px}.rh h2{margin:0 0 4px;font-size:17px}.rh div{font-size:13px;color:var(--mute)}
.rsum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.rsum div{border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center}
.rsum small{display:block;font-size:11px;color:var(--mute)}.rsum b{font-size:15px}
.rpt h4{margin:6px 0 6px}
.sigs{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:28px;text-align:center;font-size:13px;page-break-inside:avoid}
.sigs .ln{height:64px;border-bottom:1px solid var(--ink);margin:6px 8px 4px}
@media(max-width:520px){.rsum{grid-template-columns:repeat(2,1fr)}}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff}
  .top,.noprint,#toast,#modal{display:none!important}
  main{padding:0;max-width:none}
  #rpt{border:0;padding:0;margin:0}
  .tbl th{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .tbl-wrap{overflow:visible}
}
</style>
</head>
<body>
<div class="top">
  <header>
    <div><h1>Kitchen Inventory</h1><small id="sub">Inventory · Lost · Breakage</small></div>
    <button class="icon" id="refresh" title="Refresh">↻</button>
  </header>
  <nav>
    <button data-tab="dash" class="on">Dashboard</button>
    <button data-tab="inv">Inventory</button>
    <button data-tab="rep">Input</button>
    <button data-tab="his">History</button>
    <button data-tab="rec">Recap</button>
  </nav>
</div>

<main>
  <section id="dash"><p class="empty">Loading...</p></section>

  <section id="inv" hidden>
    <div class="bar">
      <input id="q" placeholder="Search item...">
      <select id="sort">
        <option value="no">Sheet order</option>
        <option value="name">Name A–Z</option>
        <option value="low">Lowest stock</option>
        <option value="broken">Most broken/lost</option>
        <option value="price">Highest price</option>
      </select>
      <button class="btn" id="newBtn">+ New item</button>
    </div>
    <div id="list"></div>
  </section>

  <section id="rep" hidden>
    <form id="repForm" class="card">
      <div class="seg" id="seg">
        <button type="button" data-t="BROKEN" class="on">Broken</button>
        <button type="button" data-t="LOST">Lost</button>
        <button type="button" data-t="ADD">Add stock</button>
      </div>
      <label>Item<select id="rItem" required></select></label>
      <div id="rInfo" class="hint"></div>
      <div class="two">
        <label>Quantity<input id="rQty" type="number" min="1" step="1" inputmode="numeric" required></label>
        <label>Location<select id="rLoc" required></select></label>
      </div>
      <div id="rVal" class="hint"></div>
      <label>Reported by<input id="rBy" required></label>
      <label>Note<textarea id="rNote" rows="2" placeholder="e.g. dropped during dinner service"></textarea></label>
      <label>Photo (optional)<input id="rPhoto" type="file" accept="image/*"></label>
      <img id="rPrev" class="prev" hidden>
      <button class="btn full red" id="rSubmit">Report broken</button>
    </form>
  </section>

  <section id="his" hidden>
    <div class="bar">
      <select id="hType">
        <option value="">All types</option><option>BROKEN</option><option>LOST</option>
        <option>ADD</option><option>NEW ITEM</option><option>CLOSE MONTH</option>
      </select>
      <select id="hLoc"></select>
      <input id="hMonth" type="month">
    </div>
    <div id="hList"></div>
  </section>

  <section id="rec" hidden>
    <div class="card noprint">
      <div class="flex">
        <div><h3 style="margin:0">Month closing</h3><div class="meta" id="closeInfo">-</div></div>
        <button class="btn red" id="closeBtn">Close month…</button>
      </div>
    </div>
    <div class="card noprint">
      <div class="bar">
        <input type="month" id="cMonth">
        <select id="cLoc"></select>
      </div>
      <h4 style="margin-top:0">Signatures</h4>
      <div class="two">
        <input id="s1n" placeholder="Prepared by – name"><input id="s1r" placeholder="Position">
        <input id="s2n" placeholder="Checked by – name"><input id="s2r" placeholder="Position">
        <input id="s3n" placeholder="Approved by – name"><input id="s3r" placeholder="Position">
      </div>
      <div class="acts" style="margin:14px 0 0">
        <button class="btn" id="cPrint">Print / Save PDF</button>
        <button class="btn ghost" id="cXls">Download Excel</button>
      </div>
    </div>
    <div id="rpt" class="card rpt"></div>
  </section>
</main>

<div id="modal" class="modal" hidden><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbxzVhZFbhwYKZKc8Ui2c8DiAAoowoC39D9UYmbTfchxQvI_-DmDwPE-QQADeUI0cNOY/exec';

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S = { items: [], log: [], locs: [], closings: [], hasLost: false, hasPrice: false, low: 5, pin: false, type: 'BROKEN' };

/* ---------- API ---------- */
async function get(action, params = {}) {
  const u = new URL(API.trim());
  u.searchParams.set('action', action);
  for (const k in params) u.searchParams.set(k, params[k]);
  const j = await (await fetch(u)).json();
  if (!j.ok) throw new Error(j.error);
  return j.data;
}
async function post(body) {
  if (S.pin && !ls('inv_pin')) {
    const p = prompt('Enter PIN');
    if (!p) throw new Error('PIN required');
    ls('inv_pin', p);
  }
  body.pin = ls('inv_pin') || '';
  body.by = body.by || ls('inv_by') || '';
  const r = await fetch(API.trim(), { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  const j = await r.json();
  if (!j.ok) { if (j.error === 'Wrong PIN') ls('inv_pin', null); throw new Error(j.error); }
  return j.data;
}

/* ---------- UTILS ---------- */
function ls(k, v) {
  try {
    if (v === undefined) return localStorage.getItem(k);
    if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v);
  } catch (e) { return null; }
}
function toast(m, err) {
  const t = $('#toast'); t.textContent = m; t.className = 'show' + (err ? ' err' : '');
  clearTimeout(t._t); t._t = setTimeout(() => t.className = '', 3500);
}
function noImg(el) { const d = document.createElement('div'); d.className = el.className + ' ph'; d.textContent = '🍽'; el.replaceWith(d); }
function thumb(src, cls = 'th') {
  return src ? `<img class="${cls}" src="${esc(src)}" loading="lazy" referrerpolicy="no-referrer" onerror="noImg(this)">`
             : `<div class="${cls} ph">🍽</div>`;
}
const rp = n => 'Rp ' + Math.round(n || 0).toLocaleString('id-ID');
const byRow = r => S.items.find(i => i.row == r);
const priceOf = name => (S.items.find(i => i.item === name) || {}).harga || 0;
const lossVal = l => l.value || l.qty * (l.price || priceOf(l.item));
const isLoss = l => l.type === 'BROKEN' || l.type === 'LOST';
const ym = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
const thisMonth = () => ym(new Date());
function monthLabel(m) { const [y, mo] = m.split('-'); return new Date(+y, +mo - 1, 1).toLocaleString('en', { month: 'long', year: 'numeric' }); }
const closedMonths = () => [...new Set(S.closings.map(c => c.month))].sort();
function compress(file) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, 1000 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = img.width * s; c.height = img.height * s;
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      res(c.toDataURL('image/jpeg', 0.75));
    };
    img.onerror = () => rej(new Error('Photo format not supported, choose another photo'));
    img.src = URL.createObjectURL(file);
  });
}

/* ---------- LOAD ---------- */
async function load() {
  $('#sub').textContent = 'Loading...';
  try {
    const [inv, log, cl] = await Promise.all([get('list'), get('log', { limit: 3000 }), get('closing')]);
    S.items = inv.items; S.hasLost = inv.hasLost; S.hasPrice = inv.hasPrice;
    S.low = inv.lowStock; S.pin = inv.pinRequired; S.locs = inv.locations || []; S.log = log; S.closings = cl;
    fillLocs(); renderDash(); renderList(); fillSelect(); renderHis(); renderCloseInfo(); renderRecap();
    $('#sub').textContent = 'Updated ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  } catch (e) { toast(e.message, 1); $('#sub').textContent = 'Failed to load'; }
}

function fillLocs() {
  const opts = S.locs.map(l => `<option>${esc(l)}</option>`).join('');
  [['#rLoc', '— choose location —'], ['#hLoc', 'All locations'], ['#cLoc', 'All locations']].forEach(([id, first]) => {
    const s = $(id), v = s.value;
    s.innerHTML = `<option value="">${first}</option>` + opts;
    s.value = v;
  });
}

/* ---------- DASHBOARD ---------- */
function renderDash() {
  const m = S.log.filter(l => l.ts.startsWith(thisMonth()));
  const sum = t => m.filter(l => l.type === t).reduce((a, l) => a + l.qty, 0);
  const loss = m.filter(isLoss);
  const lossTotal = loss.reduce((a, l) => a + lossVal(l), 0);
  const stock = S.items.reduce((a, i) => a + i.closing, 0);
  const low = S.items.filter(i => i.closing <= S.low).sort((a, b) => a.closing - b.closing);

  const byItem = {}, byLoc = {};
  loss.forEach(l => {
    const a = byItem[l.item] || (byItem[l.item] = { q: 0, v: 0 }); a.q += l.qty; a.v += lossVal(l);
    const k = l.loc || '-'; const b = byLoc[k] || (byLoc[k] = { q: 0, v: 0 }); b.q += l.qty; b.v += lossVal(l);
  });
  const sortKey = S.hasPrice ? 'v' : 'q';
  const top = Object.entries(byItem).sort((a, b) => b[1][sortKey] - a[1][sortKey]).slice(0, 5);
  const locs = Object.entries(byLoc).sort((a, b) => b[1][sortKey] - a[1][sortKey]);
  const line = ([n, o]) => `<div class="row"><span>${esc(n)}</span><span><b>${o.q}</b> pcs${S.hasPrice ? ' · ' + rp(o.v) : ''}</span></div>`;
  const mn = monthLabel(thisMonth());

  $('#dash').innerHTML = `
    <div class="stats">
      <div class="stat"><small>Items</small><b>${S.items.length}</b></div>
      <div class="stat g"><small>Stock on hand</small><b>${stock}</b></div>
      <div class="stat r"><small>Broken · ${mn}</small><b>${sum('BROKEN')}</b></div>
      <div class="stat a"><small>Lost · ${mn}</small><b>${sum('LOST')}</b></div>
      ${S.hasPrice ? `<div class="stat r"><small>Loss value · ${mn}</small><b>${rp(lossTotal)}</b></div>` : ''}
      <div class="stat g"><small>Added · ${mn}</small><b>${sum('ADD')}</b></div>
    </div>
    ${S.hasPrice ? '' : '<div class="card hint" style="margin:0 0 12px">Add a <b>HARGA</b> column to the sheet to see loss value in Rupiah.</div>'}
    <div class="card"><h3>Loss by location · ${mn}</h3>
      ${locs.length ? locs.map(line).join('') : '<p class="empty">Nothing reported this month</p>'}
    </div>
    <div class="card"><h3>Top broken / lost items · ${mn}</h3>
      ${top.length ? top.map(line).join('') : '<p class="empty">Nothing reported this month</p>'}
    </div>
    <div class="card"><h3>Low stock (≤ ${S.low})</h3>
      ${low.length ? low.map(i => `<div class="row"><span>${esc(i.item)}</span><b style="color:var(--red)">${i.closing}</b></div>`).join('') : '<p class="empty">All items above minimum</p>'}
    </div>`;
}

/* ---------- INVENTORY ---------- */
function renderList() {
  const q = $('#q').value.toLowerCase().trim(), sort = $('#sort').value;
  let a = S.items.filter(i => i.item.toLowerCase().includes(q));
  if (sort === 'name') a.sort((x, y) => x.item.localeCompare(y.item));
  if (sort === 'low') a.sort((x, y) => x.closing - y.closing);
  if (sort === 'broken') a.sort((x, y) => (y.broken + y.lost) - (x.broken + x.lost));
  if (sort === 'price') a.sort((x, y) => y.harga - x.harga);
  $('#list').innerHTML = a.length ? a.map(i => {
    const low = i.closing <= S.low;
    return `<div class="item" onclick="openItem(${i.row})">${thumb(i.photo)}
      <div class="info"><b>${esc(i.item)}</b>
        <div class="meta">Awal ${i.awal} · +${i.add} · Broken ${i.broken}${S.hasLost ? ' · Lost ' + i.lost : ''}</div>
        ${S.hasPrice ? `<div class="meta">${i.harga ? rp(i.harga) + ' / pcs' : 'No price'}</div>` : ''}
        ${i.remarks ? `<div class="meta">${esc(i.remarks)}</div>` : ''}
      </div>
      <div class="qty ${low ? 'low' : ''}">${i.closing}<small>${low ? 'low' : 'in stock'}</small></div></div>`;
  }).join('') : '<p class="empty">No items found</p>';
}

function openModal(html) { $('#sheet').innerHTML = html; $('#modal').hidden = false; }
function closeModal() { $('#modal').hidden = true; }
$('#modal').onclick = e => { if (e.target.id === 'modal') closeModal(); };

function openItem(row) {
  const i = byRow(row); if (!i) return;
  const h = S.log.filter(l => l.item === i.item).slice(0, 10);
  openModal(`
    <div class="mh"><h3>${esc(i.item)}</h3><button class="x" onclick="closeModal()">✕</button></div>
    ${i.photo ? `<img class="big" src="${esc(i.photo)}" referrerpolicy="no-referrer" onerror="this.remove()">` : ''}
    <div class="grid">
      <div><small>Stock awal</small><b>${i.awal}</b></div>
      <div><small>Additional</small><b>${i.add}</b></div>
      <div><small>Broken</small><b>${i.broken}</b></div>
      ${S.hasLost ? `<div><small>Lost</small><b>${i.lost}</b></div>` : ''}
      <div><small>Closing</small><b>${i.closing}</b></div>
      ${S.hasPrice ? `<div><small>Price</small><b>${i.harga ? rp(i.harga) : '-'}</b></div>` : ''}
    </div>
    <div class="acts">
      <button class="btn red" onclick="goReport(${i.row},'BROKEN')">Broken</button>
      <button class="btn amb" onclick="goReport(${i.row},'LOST')">Lost</button>
      <button class="btn" onclick="goReport(${i.row},'ADD')">Add stock</button>
    </div>
    ${S.hasPrice ? `<label>Price per pcs (Rp)<input id="eHarga" type="number" min="0" inputmode="numeric" value="${i.harga || ''}"></label>` : ''}
    <label>Remarks<input id="eRem" value="${esc(i.remarks)}"></label>
    <label>Change photo<input id="ePhoto" type="file" accept="image/*"></label>
    <img id="ePrev" class="prev" hidden>
    <button class="btn full ghost" id="eSave" onclick="saveEdit(${i.row})">Save changes</button>
    <h4>Recent history</h4>
    ${h.length ? h.map(logRow).join('') : '<p class="empty">No history yet</p>'}`);
  previewOn('#ePhoto', '#ePrev');
}

async function saveEdit(row) {
  const i = byRow(row), btn = $('#eSave'), f = $('#ePhoto').files[0];
  btn.disabled = true; btn.textContent = 'Saving...';
  try {
    await post({
      action: 'updateItem', row, item: i.item, remarks: $('#eRem').value.trim(),
      harga: $('#eHarga') ? $('#eHarga').value : undefined,
      photo: f ? await compress(f) : ''
    });
    toast('Saved'); closeModal(); load();
  } catch (e) { toast(e.message, 1); btn.disabled = false; btn.textContent = 'Save changes'; }
}

$('#newBtn').onclick = () => {
  openModal(`
    <div class="mh"><h3>New item</h3><button class="x" onclick="closeModal()">✕</button></div>
    <label>Item name<input id="nName"></label>
    <div class="two">
      <label>Stock awal<input id="nAwal" type="number" min="0" step="1" inputmode="numeric" value="0"></label>
      <label>Price per pcs (Rp)<input id="nHarga" type="number" min="0" inputmode="numeric"></label>
    </div>
    <label>Remarks<input id="nRem"></label>
    <label>Photo<input id="nPhoto" type="file" accept="image/*"></label>
    <img id="nPrev" class="prev" hidden>
    <button class="btn full" id="nSave" onclick="saveNew()">Add item</button>`);
  previewOn('#nPhoto', '#nPrev');
};

async function saveNew() {
  const name = $('#nName').value.trim(); if (!name) return toast('Item name is required', 1);
  const btn = $('#nSave'), f = $('#nPhoto').files[0];
  btn.disabled = true; btn.textContent = 'Saving...';
  try {
    await post({
      action: 'addItem', item: name, awal: +$('#nAwal').value || 0, harga: $('#nHarga').value || 0,
      remarks: $('#nRem').value.trim(), photo: f ? await compress(f) : ''
    });
    toast('Item added'); closeModal(); load();
  } catch (e) { toast(e.message, 1); btn.disabled = false; btn.textContent = 'Add item'; }
}

function previewOn(inputId, imgId) {
  $(inputId).onchange = e => {
    const f = e.target.files[0], p = $(imgId);
    if (f) { p.src = URL.createObjectURL(f); p.hidden = false; } else p.hidden = true;
  };
}

/* ---------- INPUT ---------- */
function fillSelect() {
  const s = $('#rItem'), v = s.value;
  s.innerHTML = '<option value="">— choose item —</option>' +
    [...S.items].sort((a, b) => a.item.localeCompare(b.item)).map(i => `<option value="${i.row}">${esc(i.item)}</option>`).join('');
  s.value = v; showInfo();
}
function showInfo() {
  const i = byRow($('#rItem').value);
  $('#rInfo').innerHTML = i ? `Current stock: <b>${i.closing}</b>${S.hasPrice && i.harga ? ' · ' + rp(i.harga) + ' / pcs' : ''}` : '';
  const q = +$('#rQty').value;
  $('#rVal').innerHTML = (i && q > 0 && S.hasPrice && i.harga && S.type !== 'ADD') ? `Loss value: <b style="color:var(--red)">${rp(q * i.harga)}</b>` : '';
}
function setType(t) {
  S.type = t;
  document.querySelectorAll('#seg button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  const btn = $('#rSubmit');
  btn.textContent = t === 'ADD' ? 'Add stock' : t === 'LOST' ? 'Report lost' : 'Report broken';
  btn.className = 'btn full ' + (t === 'ADD' ? '' : t === 'LOST' ? 'amb' : 'red');
  $('#rLoc').required = t !== 'ADD';
  showInfo();
}
function goReport(row, t) { closeModal(); tab('rep'); setType(t); $('#rItem').value = row; showInfo(); $('#rQty').focus(); }

document.querySelectorAll('#seg button').forEach(b => b.onclick = () => setType(b.dataset.t));
$('#rItem').onchange = showInfo;
$('#rQty').oninput = showInfo;
previewOn('#rPhoto', '#rPrev');

$('#repForm').onsubmit = async e => {
  e.preventDefault();
  const i = byRow($('#rItem').value); if (!i) return toast('Choose an item', 1);
  const qty = +$('#rQty').value;
  if (S.type !== 'ADD' && qty > i.closing) return toast('Quantity is more than current stock (' + i.closing + ')', 1);
  if (S.type !== 'ADD' && !$('#rLoc').value) return toast('Choose a location', 1);
  const by = $('#rBy').value.trim(); ls('inv_by', by);
  const btn = $('#rSubmit'), f = $('#rPhoto').files[0];
  btn.disabled = true; btn.textContent = 'Saving...';
  try {
    await post({
      action: 'movement', type: S.type, row: i.row, item: i.item, qty, by,
      location: $('#rLoc').value, note: $('#rNote').value.trim(), photo: f ? await compress(f) : ''
    });
    toast('Saved');
    $('#rQty').value = ''; $('#rNote').value = ''; $('#rPhoto').value = ''; $('#rPrev').hidden = true;
    await load();
  } catch (err) { toast(err.message, 1); }
  finally { btn.disabled = false; setType(S.type); }
};

/* ---------- HISTORY ---------- */
function logRow(l) {
  if (l.type === 'CLOSE MONTH') {
    return `<div class="log"><span class="tag t-CLOSEMONTH">CLOSE</span>
      <div class="info"><b>Month closed</b> · ${l.qty} items<div class="meta">${esc(l.ts)} · ${esc(l.by || '-')} · ${esc(l.note)}</div></div></div>`;
  }
  const sign = (l.type === 'ADD' || l.type === 'NEW ITEM') ? '+' : isLoss(l) ? '−' : '';
  const val = isLoss(l) && S.hasPrice ? ' · ' + rp(lossVal(l)) : '';
  return `<div class="log"><span class="tag t-${l.type.replace(/\s/g, '')}">${esc(l.type)}</span>
    <div class="info"><b>${esc(l.item)}</b> <span class="q">${sign}${l.qty}</span>${val}
      <div class="meta">${esc(l.ts)} · ${esc(l.by || '-')}${l.loc ? ' · ' + esc(l.loc) : ''}${l.note ? ' · ' + esc(l.note) : ''}</div></div>
    ${l.photo ? `<a href="${esc(l.photo)}" target="_blank">${thumb(l.photo, 'th sm')}</a>` : ''}</div>`;
}
function renderHis() {
  const t = $('#hType').value, m = $('#hMonth').value, loc = $('#hLoc').value;
  const a = S.log.filter(l => (!t || l.type === t) && (!m || l.ts.startsWith(m)) && (!loc || l.loc === loc));
  $('#hList').innerHTML = a.length ? a.map(logRow).join('') : '<p class="empty">No records</p>';
}

/* ---------- CLOSE MONTH ---------- */
function renderCloseInfo() {
  const ms = closedMonths(), last = ms[ms.length - 1];
  $('#closeInfo').innerHTML = last ? 'Last closed: <b>' + monthLabel(last) + '</b>' : 'No month closed yet';
}
function defaultCloseMonth() {
  const ms = closedMonths(), last = ms[ms.length - 1];
  const d = new Date();
  if (d.getDate() <= 15) { d.setDate(1); d.setMonth(d.getMonth() - 1); }
  let m = ym(d);
  if (last && m <= last) { const [y, mo] = last.split('-').map(Number); m = ym(new Date(y, mo, 1)); }
  return m > thisMonth() ? thisMonth() : m;
}
function openClose() {
  openModal(`
    <div class="mh"><h3>Close month</h3><button class="x" onclick="closeModal()">✕</button></div>
    <label>Month to close<input type="month" id="clM" value="${defaultCloseMonth()}" max="${thisMonth()}"></label>
    <div class="note">
      <b>What happens:</b><br>
      1. A snapshot is saved to tab <b>ARSIP yyyy-mm</b> and to the <b>CLOSING</b> history.<br>
      2. Closing stock becomes the new Stock Awal.<br>
      3. Additional, Broken and Lost are reset to 0. Inputs made after the month ended are carried into the new month.<br>
      This cannot be undone from the app.
    </div>
    <label>Type <b>TUTUP</b> to confirm<input id="clC" autocomplete="off" autocapitalize="characters"></label>
    <button class="btn full red" id="clBtn" onclick="doClose()">Close month</button>`);
}
async function doClose() {
  const m = $('#clM').value;
  if (!m) return toast('Choose a month', 1);
  if ($('#clC').value.trim().toUpperCase() !== 'TUTUP') return toast('Type TUTUP to confirm', 1);
  const btn = $('#clBtn'); btn.disabled = true; btn.textContent = 'Closing...';
  try {
    const r = await post({ action: 'closeMonth', month: m, confirm: 'TUTUP' });
    toast(monthLabel(m) + ' closed · ' + r.items + ' items');
    closeModal(); $('#cMonth').value = m; await load();
  } catch (e) { toast(e.message, 1); btn.disabled = false; btn.textContent = 'Close month'; }
}

/* ---------- RECAP ---------- */
const SIGS = [['s1', 'Prepared by'], ['s2', 'Checked by'], ['s3', 'Approved by']];
function sigs() { return SIGS.map(([k, label]) => ({ label, name: $('#' + k + 'n').value.trim(), role: $('#' + k + 'r').value.trim() })); }

function recapData() {
  const m = $('#cMonth').value || thisMonth(), loc = $('#cLoc').value;
  const logs = S.log.filter(l => l.ts.startsWith(m) && (!loc || l.loc === loc) && ['ADD', 'BROKEN', 'LOST'].includes(l.type));
  const cl = {};
  S.closings.filter(c => c.month === m).forEach(c => cl[c.item] = c);
  const closed = Object.keys(cl).length > 0;
  const agg = {};
  S.items.forEach(i => {
    const c = cl[i.item];
    agg[i.item] = { no: i.no, item: i.item, price: c ? (c.harga || i.harga) : i.harga, add: 0, broken: 0, lost: 0, value: 0,
      opening: c ? c.awal : '', stock: closed ? (c ? c.closing : '') : i.closing };
  });
  Object.values(cl).forEach(c => {
    if (!agg[c.item]) agg[c.item] = { no: c.no, item: c.item, price: c.harga, add: 0, broken: 0, lost: 0, value: 0, opening: c.awal, stock: c.closing };
  });
  logs.forEach(l => {
    const a = agg[l.item] || (agg[l.item] = { no: '', item: l.item, price: l.price, add: 0, broken: 0, lost: 0, value: 0, opening: '', stock: '' });
    if (l.type === 'ADD') a.add += l.qty;
    else { a[l.type === 'BROKEN' ? 'broken' : 'lost'] += l.qty; a.value += lossVal(l); }
  });
  let rows = Object.values(agg);
  if (loc) rows = rows.filter(r => r.add || r.broken || r.lost);
  const byLoc = {};
  logs.filter(isLoss).forEach(l => {
    const k = l.loc || '-';
    const b = byLoc[k] || (byLoc[k] = { loc: k, broken: 0, lost: 0, value: 0 });
    b[l.type === 'BROKEN' ? 'broken' : 'lost'] += l.qty; b.value += lossVal(l);
  });
  const t = rows.reduce((a, r) => ({ add: a.add + r.add, broken: a.broken + r.broken, lost: a.lost + r.lost, value: a.value + r.value }),
    { add: 0, broken: 0, lost: 0, value: 0 });
  return { m, loc, closed, rows, t,
    byLoc: Object.values(byLoc).sort((a, b) => b.value - a.value || (b.broken + b.lost) - (a.broken + a.lost)),
    detail: logs.filter(isLoss).slice().reverse() };
}

function renderRecap() {
  const d = recapData(), P = S.hasPrice, C = d.closed, sg = sigs();
  const cols = 6 + (P ? 2 : 0) + (C ? 1 : 0);
  $('#rpt').innerHTML = `
    <div class="rh">
      <h2>Kitchen Utensils – Lost &amp; Breakage Report</h2>
      <div>Period: <b>${monthLabel(d.m)}</b> · Location: <b>${esc(d.loc || 'All locations')}</b></div>
      <div>${C ? 'Month closed' : 'Month not closed yet – stock shown is current stock'} · Generated ${new Date().toLocaleString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' })}</div>
    </div>
    <div class="rsum">
      <div><small>Added</small><b>${d.t.add}</b></div>
      <div><small>Broken</small><b>${d.t.broken}</b></div>
      <div><small>Lost</small><b>${d.t.lost}</b></div>
      <div><small>${P ? 'Loss value' : 'Total loss'}</small><b>${P ? rp(d.t.value) : d.t.broken + d.t.lost}</b></div>
    </div>

    <h4>1. Summary per item</h4>
    <div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>No</th><th>Item</th>${P ? '<th class="n">Price</th>' : ''}${C ? '<th class="n">Opening</th>' : ''}<th class="n">Added</th><th class="n">Broken</th><th class="n">Lost</th>${P ? '<th class="n">Loss value</th>' : ''}<th class="n">${C ? 'Closing stock' : 'Current stock'}</th></tr></thead>
      <tbody>${d.rows.map((r, i) => `<tr><td>${esc(r.no || i + 1)}</td><td>${esc(r.item)}</td>${P ? `<td class="n">${r.price ? rp(r.price) : '-'}</td>` : ''}${C ? `<td class="n">${r.opening}</td>` : ''}<td class="n">${r.add}</td><td class="n">${r.broken}</td><td class="n">${r.lost}</td>${P ? `<td class="n">${rp(r.value)}</td>` : ''}<td class="n">${r.stock}</td></tr>`).join('') || `<tr><td colspan="${cols}" class="empty">No data</td></tr>`}</tbody>
      <tfoot><tr><td></td><td>TOTAL</td>${P ? '<td></td>' : ''}${C ? '<td></td>' : ''}<td class="n">${d.t.add}</td><td class="n">${d.t.broken}</td><td class="n">${d.t.lost}</td>${P ? `<td class="n">${rp(d.t.value)}</td>` : ''}<td></td></tr></tfoot>
    </table></div>

    <h4>2. Loss by location</h4>
    <div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>Location</th><th class="n">Broken</th><th class="n">Lost</th>${P ? '<th class="n">Loss value</th>' : ''}</tr></thead>
      <tbody>${d.byLoc.map(b => `<tr><td>${esc(b.loc)}</td><td class="n">${b.broken}</td><td class="n">${b.lost}</td>${P ? `<td class="n">${rp(b.value)}</td>` : ''}</tr>`).join('') || `<tr><td colspan="4" class="empty">No breakage or loss this period</td></tr>`}</tbody>
    </table></div>

    <h4>3. Incident detail</h4>
    <div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>Date</th><th>Type</th><th>Item</th><th class="n">Qty</th>${P ? '<th class="n">Value</th>' : ''}<th>Location</th><th>Reported by</th><th>Note</th></tr></thead>
      <tbody>${d.detail.map(l => `<tr><td>${esc(l.ts)}</td><td>${l.type}</td><td>${esc(l.item)}</td><td class="n">${l.qty}</td>${P ? `<td class="n">${rp(lossVal(l))}</td>` : ''}<td>${esc(l.loc || '-')}</td><td>${esc(l.by || '-')}</td><td>${esc(l.note)}</td></tr>`).join('') || `<tr><td colspan="8" class="empty">No incidents</td></tr>`}</tbody>
    </table></div>

    <div class="sigs">${sg.map(s => `<div>${s.label}<div class="ln"></div><b>${esc(s.name) || '&nbsp;'}</b><br><span style="color:var(--mute)">${esc(s.role) || '&nbsp;'}</span></div>`).join('')}</div>`;
}

function downloadXls() {
  if (!window.XLSX) return toast('Excel library not loaded, check internet connection', 1);
  const d = recapData(), P = S.hasPrice, C = d.closed, sg = sigs();
  const head = [['KITCHEN UTENSILS - LOST & BREAKAGE REPORT'], ['Period', monthLabel(d.m)], ['Location', d.loc || 'All locations'],
    ['Status', C ? 'Month closed' : 'Month not closed - stock is current stock'], []];

  const h1 = ['NO', 'ITEM', ...(P ? ['PRICE'] : []), ...(C ? ['OPENING'] : []), 'ADDED', 'BROKEN', 'LOST', ...(P ? ['LOSS VALUE'] : []), C ? 'CLOSING STOCK' : 'CURRENT STOCK'];
  const s1 = head.concat([h1]);
  d.rows.forEach((r, i) => s1.push([r.no || i + 1, r.item, ...(P ? [r.price] : []), ...(C ? [r.opening] : []), r.add, r.broken, r.lost, ...(P ? [r.value] : []), r.stock]));
  s1.push(['', 'TOTAL', ...(P ? [''] : []), ...(C ? [''] : []), d.t.add, d.t.broken, d.t.lost, ...(P ? [d.t.value] : []), '']);
  s1.push([], [], [sg[0].label, '', '', sg[1].label, '', '', sg[2].label], [], [], [],
    [sg[0].name, '', '', sg[1].name, '', '', sg[2].name], [sg[0].role, '', '', sg[1].role, '', '', sg[2].role]);

  const s2 = head.concat([P ? ['LOCATION', 'BROKEN', 'LOST', 'LOSS VALUE'] : ['LOCATION', 'BROKEN', 'LOST']]);
  d.byLoc.forEach(b => s2.push(P ? [b.loc, b.broken, b.lost, b.value] : [b.loc, b.broken, b.lost]));

  const s3 = head.concat([['DATE', 'TYPE', 'ITEM', 'QTY', ...(P ? ['PRICE', 'VALUE'] : []), 'LOCATION', 'REPORTED BY', 'NOTE']]);
  d.detail.forEach(l => s3.push([l.ts, l.type, l.item, l.qty, ...(P ? [l.price || priceOf(l.item), lossVal(l)] : []), l.loc, l.by, l.note]));

  const wb = XLSX.utils.book_new();
  const add = (aoa, name, cols) => { const ws = XLSX.utils.aoa_to_sheet(aoa); ws['!cols'] = cols.map(w => ({ wch: w })); XLSX.utils.book_append_sheet(wb, ws, name); };
  add(s1, 'Summary', [16, 32, 12, 10, 9, 9, 9, 14, 14]);
  add(s2, 'By Location', [24, 10, 10, 14]);
  add(s3, 'Detail', [17, 9, 28, 6, ...(P ? [12, 12] : []), 18, 16, 30]);
  XLSX.writeFile(wb, 'Lost-Breakage-' + d.m + (d.loc ? '-' + d.loc.replace(/\W+/g, '_') : '') + '.xlsx');
}

/* ---------- TABS & INIT ---------- */
function tab(t) {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  document.querySelectorAll('main section').forEach(s => s.hidden = s.id !== t);
  if (t === 'rec') renderRecap();
  scrollTo(0, 0);
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => tab(b.dataset.tab));
$('#q').oninput = renderList; $('#sort').onchange = renderList;
$('#hType').onchange = renderHis; $('#hMonth').onchange = renderHis; $('#hLoc').onchange = renderHis;
$('#cMonth').onchange = renderRecap; $('#cLoc').onchange = renderRecap;
SIGS.forEach(([k]) => ['n', 'r'].forEach(x => {
  const el = $('#' + k + x); el.value = ls('inv_' + k + x) || '';
  el.oninput = () => { ls('inv_' + k + x, el.value); renderRecap(); };
}));
$('#closeBtn').onclick = openClose;
$('#cPrint').onclick = () => { renderRecap(); window.print(); };
$('#cXls').onclick = downloadXls;
$('#refresh').onclick = load;
$('#rBy').value = ls('inv_by') || '';
$('#hMonth').value = thisMonth();
$('#cMonth').value = thisMonth();
load();
</script>
</body>
