<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kitchen Inventory</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{--bg:#f4f5f3;--card:#fff;--ink:#1d2621;--mute:#6a756e;--line:#e1e5e1;--pri:#1f6f54;--pri2:#e5f1ec;--red:#c0392b;--red2:#fbecea;--amb:#b26b00;--amb2:#fdf3e1;--blu:#2b5797;--blu2:#e8eef7}
*{box-sizing:border-box}
body{margin:0;font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
.top{position:sticky;top:0;z-index:5}
header{background:var(--pri);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:17px;margin:0}header small{opacity:.8;font-size:12px}
.icon{background:rgba(255,255,255,.15);border:0;color:#fff;font-size:18px;width:36px;height:36px;border-radius:8px;cursor:pointer}
nav{display:flex;background:#fff;border-bottom:1px solid var(--line)}
nav button{flex:1;border:0;background:none;padding:12px 2px;font:inherit;font-size:13px;color:var(--mute);border-bottom:3px solid transparent;cursor:pointer}
nav button.on{color:var(--pri);border-color:var(--pri);font-weight:600}
main{max-width:900px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.stat small{color:var(--mute);font-size:12px}.stat b{display:block;font-size:22px;margin-top:2px}
.stat.r b{color:var(--red)}.stat.a b{color:var(--amb)}.stat.g b{color:var(--pri)}
h3{margin:0 0 10px;font-size:15px}h4{margin:18px 0 8px;font-size:14px}
.bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.bar input,.bar select{flex:1;min-width:130px;width:auto}
input,select,textarea{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:12px}
label input,label select,label textarea{margin-top:4px}
.btn{border:0;border-radius:8px;padding:10px 14px;font:inherit;font-weight:600;background:var(--pri);color:#fff;cursor:pointer;white-space:nowrap}
.btn.red{background:var(--red)}.btn.amb{background:var(--amb)}.btn.blu{background:var(--blu)}.btn.ghost{background:var(--pri2);color:var(--pri)}
.btn.full{width:100%}.btn:disabled{opacity:.6}
.link{border:0;background:none;color:var(--pri);font:inherit;font-size:12px;font-weight:600;cursor:pointer;padding:0;text-decoration:underline}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:7px 14px;font:inherit;font-size:13px;white-space:nowrap;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.code{display:inline-block;font-size:11px;font-weight:700;color:var(--blu);background:var(--blu2);border-radius:4px;padding:1px 6px;margin-right:6px;vertical-align:1px;letter-spacing:.3px}
.item,.log{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.item{cursor:pointer}
.th{width:56px;height:56px;border-radius:8px;object-fit:cover;flex:none;background:var(--pri2)}
.th.sm{width:44px;height:44px}
.ph{display:flex;align-items:center;justify-content:center;font-size:22px}
.info{flex:1;min-width:0}.meta{color:var(--mute);font-size:12px;margin-top:2px}
.meta b{color:var(--ink)}
.qty{text-align:center;font-size:22px;font-weight:700;color:var(--pri);min-width:60px}
.qty small{display:block;font-size:11px;font-weight:500;color:var(--mute)}
.qty.low{color:var(--red)}
.seg{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.seg button{flex:1;padding:10px 6px;border:1px solid var(--line);background:#fff;border-radius:8px;font:inherit;font-size:14px;cursor:pointer;color:var(--mute)}
.seg button.on[data-t=BROKEN]{background:var(--red2);border-color:var(--red);color:var(--red);font-weight:600}
.seg button.on[data-t=LOST]{background:var(--amb2);border-color:var(--amb);color:var(--amb);font-weight:600}
.seg button.on[data-t=ADD]{background:var(--pri2);border-color:var(--pri);color:var(--pri);font-weight:600}
.seg button.on[data-t=TRANSFER]{background:var(--blu2);border-color:var(--blu);color:var(--blu);font-weight:600}
.hint{font-size:13px;margin:-6px 0 12px;color:var(--mute)}
.note{font-size:13px;color:var(--ink);background:var(--bg);border-radius:8px;padding:12px;margin-bottom:12px;line-height:1.5}
.prev{max-width:160px;border-radius:8px;margin-bottom:12px;display:block}
.tag{font-size:11px;font-weight:700;padding:4px 6px;border-radius:6px;flex:none;width:72px;text-align:center}
.t-BROKEN{background:var(--red2);color:var(--red)}.t-LOST{background:var(--amb2);color:var(--amb)}
.t-ADD,.t-NEWITEM{background:var(--pri2);color:var(--pri)}.t-CLOSEMONTH,.t-TRF{background:var(--blu2);color:var(--blu)}
.q{font-weight:700}
.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}.row:last-child{border:0}
.row span:last-child{text-align:right;white-space:nowrap}
.empty{color:var(--mute);text-align:center;padding:20px;font-size:14px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.modal[hidden]{display:none}
.sheet{background:#fff;width:100%;max-width:600px;max-height:90vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
@media(min-width:600px){.modal{align-items:center}.sheet{border-radius:16px}}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.mh h3{margin:0;font-size:17px}
.x{border:0;background:var(--bg);width:32px;height:32px;border-radius:8px;cursor:pointer}
.big{width:100%;max-height:240px;object-fit:contain;background:var(--bg);border-radius:10px;margin-bottom:12px}
.acts{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}.acts .btn{flex:1}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.flex{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,120px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;transition:.25s;z-index:20;font-size:14px;max-width:90vw}
#toast.show{transform:translate(-50%,0)}#toast.err{background:var(--red)}
.tbl-wrap{overflow-x:auto;margin-bottom:16px}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th,.tbl td{border:1px solid #cfd6d1;padding:5px 6px;text-align:left;vertical-align:top}
.tbl th{background:var(--pri2);font-weight:600;white-space:nowrap}
.tbl .n{text-align:right;white-space:nowrap}
.tbl tfoot td{font-weight:700;background:var(--bg)}
.rh{text-align:center;margin-bottom:14px}.rh h2{margin:0 0 4px;font-size:17px}.rh div{font-size:13px;color:var(--mute)}
.rsum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.rsum div{border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center}
.rsum small{display:block;font-size:11px;color:var(--mute)}.rsum b{font-size:15px}
.rpt h4{margin:6px 0 6px}
.sigs{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:28px;text-align:center;font-size:13px;page-break-inside:avoid}
.sigs .ln{height:64px;border-bottom:1px solid var(--ink);margin:6px 8px 4px}
/* ---------- QR labels ---------- */
.labels{display:grid;gap:2mm;justify-content:center}
.labels.lqm{grid-template-columns:repeat(auto-fill,60mm)}
.labels.lqs{grid-template-columns:repeat(auto-fill,45mm)}
.labels.lm{grid-template-columns:repeat(auto-fill,60mm)}
.labels.ll{grid-template-columns:repeat(auto-fill,90mm)}
.labels.ls{grid-template-columns:repeat(auto-fill,44mm)}
.lbl{position:relative;background:#fff;border:1px dashed #b9c2bc;border-radius:2mm;display:flex;gap:2.5mm;padding:2.5mm;overflow:hidden;break-inside:avoid;page-break-inside:avoid;color:#000}
.lqm .lbl{width:60mm;height:85mm}.lqs .lbl{width:45mm;height:65mm}
.lm .lbl{width:60mm;height:38mm}.ll .lbl{width:90mm;height:50mm}.ls .lbl{width:44mm;height:28mm;padding:2mm;gap:2mm}
.lqr{width:100%;height:auto;display:block}
.lph{flex:none;border-radius:1.5mm;background:#f1f3f1;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:14px}
.lph img{width:100%;height:100%;object-fit:cover}
.lx{position:absolute;top:1mm;right:1mm;border:0;background:#fbecea;color:#c0392b;border-radius:50%;width:20px;height:20px;font-size:11px;cursor:pointer;line-height:20px;padding:0;z-index:2}
/* QRIS card (portrait) */
.lbl.qc{flex-direction:column;padding:0;gap:0;border-radius:3mm;border:1px solid #cfd6d1}
.qh{background:#1f6f54;color:#fff;text-align:center;padding:2.2mm 2mm 1.8mm;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.qh b{display:block;font-size:8.5pt;letter-spacing:1px}
.qh span{display:block;font-size:7pt;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:.3mm}
.lqs .qh{padding:1.6mm 1.5mm 1.2mm}.lqs .qh b{font-size:7pt}.lqs .qh span{font-size:6pt}
.qbody{flex:1;display:flex;flex-direction:column;align-items:center;padding:2.5mm 3mm 2.5mm;gap:1.2mm;min-height:0}
.lqs .qbody{padding:2mm 2.5mm;gap:1mm}
.qqr{width:48mm}.lqs .qqr{width:36mm}
.qcode{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;font-size:12pt;letter-spacing:1.5px}
.lqs .qcode{font-size:9pt;letter-spacing:1px}
.qcode.none{color:#c0392b;font-family:inherit;font-weight:500;font-size:8pt;letter-spacing:0}
.qfoot{display:flex;align-items:center;gap:2mm;width:100%;margin-top:auto;border-top:1px dashed #ccc;padding-top:1.8mm}
.qfoot .lph{width:11mm;height:11mm}.lqs .qfoot .lph{width:8mm;height:8mm;font-size:10px}
.qname{flex:1;min-width:0;font-weight:700;font-size:9pt;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.lqs .qname{font-size:7pt}
/* Landscape layouts */
.lqrw{flex:none;display:flex;align-items:center;justify-content:center}
.lm .lqrw{width:31mm}.ll .lqrw{width:43mm}.ls .lqrw{width:23mm}
.lbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:1mm}
.lm .lph{width:13mm;height:13mm}.ll .lph{width:22mm;height:22mm}
.lname{font-weight:700;font-size:8.5pt;line-height:1.15;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.ll .lname{font-size:11pt}.ls .lname{font-size:7.5pt}
.lsec{font-size:6.5pt;color:#555}.ll .lsec{font-size:8.5pt}
.lcode{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;font-size:9pt;margin-top:auto;letter-spacing:.3px}
.ll .lcode{font-size:12pt}.ls .lcode{font-size:8pt}
.lcode.none{color:#c0392b;font-family:inherit;font-weight:500;font-size:7pt}
@media(max-width:520px){.rsum{grid-template-columns:repeat(2,1fr)}}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff}
  .top,.noprint,#toast,#modal{display:none!important}
  main{padding:0;max-width:none}
  #rpt{border:0;padding:0;margin:0}
  .tbl th,.lph,.qh{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .tbl-wrap{overflow:visible}
  .labels{justify-content:start}
  .lbl{border:1px dashed #999}
  .lbl.qc{border:1px solid #999}
}
</style>
</head>
<body>
<div class="top">
  <header>
    <div><h1>Kitchen Inventory</h1><small id="sub">Inventory · Lost · Breakage</small></div>
    <button class="icon" id="refresh" title="Refresh">↻</button>
  </header>
  <nav>
    <button data-tab="dash" class="on">Dashboard</button>
    <button data-tab="inv">Inventory</button>
    <button data-tab="rep">Input</button>
    <button data-tab="his">History</button>
    <button data-tab="rec">Recap</button>
  </nav>
</div>

<main>
  <section id="dash"><p class="empty">Loading...</p></section>

  <section id="inv" hidden>
    <div class="chips" id="secChips"></div>
    <div class="bar">
      <input id="q" placeholder="Search name or code...">
      <select id="sort">
        <option value="no">Sheet order</option>
        <option value="code">Code</option>
        <option value="name">Name A–Z</option>
        <option value="low">Lowest stock</option>
        <option value="broken">Most broken/lost</option>
        <option value="price">Highest price</option>
      </select>
      <button class="btn ghost" id="lblBtn">QR Labels</button>
      <button class="btn" id="newBtn">+ New item</button>
    </div>
    <div id="list"></div>
  </section>

  <section id="rep" hidden>
    <form id="repForm" class="card">
      <div class="seg" id="seg">
        <button type="button" data-t="BROKEN" class="on">Broken</button>
        <button type="button" data-t="LOST">Lost</button>
        <button type="button" data-t="ADD">Add</button>
        <button type="button" data-t="TRANSFER" id="segTrf">Transfer</button>
      </div>
      <label id="rSecWrap"><span id="rSecLbl">Section</span><select id="rSec"></select></label>
      <label>Item<select id="rItem" required></select></label>
      <div id="rInfo" class="hint"></div>
      <div class="two">
        <label>Quantity<input id="rQty" type="number" min="1" step="1" inputmode="numeric" required></label>
        <label id="rToWrap" hidden>To section<select id="rTo"></select></label>
      </div>
      <div id="rVal" class="hint"></div>
      <label>Reported by<input id="rBy" required></label>
      <label>Note<textarea id="rNote" rows="2" placeholder="e.g. dropped during dinner service"></textarea></label>
      <div id="rPhotoWrap">
        <label>Photo (optional)<input id="rPhoto" type="file" accept="image/*"></label>
        <img id="rPrev" class="prev" hidden>
      </div>
      <button class="btn full red" id="rSubmit">Report broken</button>
    </form>
  </section>

  <section id="his" hidden>
    <div class="bar">
      <select id="hType">
        <option value="">All types</option><option>BROKEN</option><option>LOST</option><option>ADD</option>
        <option>TRANSFER IN</option><option>TRANSFER OUT</option><option>NEW ITEM</option><option>CLOSE MONTH</option>
      </select>
      <select id="hSec"></select>
      <input id="hMonth" type="month">
    </div>
    <div id="hList"></div>
  </section>

  <section id="rec" hidden>
    <div class="card noprint">
      <div class="flex">
        <div><h3 style="margin:0">Month closing</h3><div class="meta" id="closeInfo">-</div></div>
        <button class="btn red" id="closeBtn">Close month…</button>
      </div>
    </div>
    <div class="card noprint">
      <div class="bar">
        <input type="month" id="cMonth">
        <select id="cSec"></select>
      </div>
      <h4 style="margin-top:0">Signatures</h4>
      <div class="two">
        <input id="s1n" placeholder="Prepared by – name"><input id="s1r" placeholder="Position">
        <input id="s2n" placeholder="Checked by – name"><input id="s2r" placeholder="Position">
        <input id="s3n" placeholder="Approved by – name"><input id="s3r" placeholder="Position">
      </div>
      <div class="acts" style="margin:14px 0 0">
        <button class="btn" id="cPrint">Print / Save PDF</button>
        <button class="btn ghost" id="cXls">Download Excel</button>
      </div>
    </div>
    <div id="rpt" class="card rpt"></div>
  </section>

  <section id="lab" hidden>
    <div class="card noprint">
      <div class="flex" style="margin-bottom:12px">
        <h3 style="margin:0">QR code labels</h3>
        <button class="btn ghost" onclick="tab('inv')">← Back</button>
      </div>
      <div class="bar">
        <select id="lSec"></select>
        <input id="lQ" placeholder="Filter name or code...">
      </div>
      <div class="two">
        <label>Label style &amp; size
          <select id="lSize">
            <option value="qm">QRIS card · 60 × 85 mm (3 per row)</option>
            <option value="qs">QRIS card small · 45 × 65 mm (4 per row)</option>
            <option value="m">Landscape medium · 60 × 38 mm (3 per row)</option>
            <option value="l">Landscape large · 90 × 50 mm (2 per row)</option>
            <option value="s">Landscape small · 44 × 28 mm (4 per row, no photo)</option>
          </select>
        </label>
        <label>QR content
          <select id="lMode">
            <option value="link">Link to app (scan with phone camera)</option>
            <option value="code">Code only (for USB/Bluetooth scanner)</option>
          </select>
        </label>
        <label>Copies per item<input id="lCopies" type="number" min="1" max="20" value="1" inputmode="numeric"></label>
      </div>
      <div class="flex">
        <div class="meta" id="lInfo"></div>
        <button class="btn" id="lPrint">Print labels</button>
      </div>
    </div>
    <div id="labels" class="labels lqm"></div>
  </section>
</main>

<div id="modal" class="modal" hidden><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbxzVhZFbhwYKZKc8Ui2c8DiAAoowoC39D9UYmbTfchxQvI_-DmDwPE-QQADeUI0cNOY/exec';

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S = { items: [], groups: [], log: [], secs: [], closings: [], hasLost: false, hasPrice: false, hasSection: false, hasTrf: false,
          hasCode: false, codePrefix: 'KU-', low: 5, pin: false, type: 'BROKEN', sec: '' };
let LBL = { only: null, skip: new Set(), cur: [] };
const APP_URL = location.href.split(/[?#]/)[0];
let DEEP = (() => { const p = new URLSearchParams(location.search); return { code: p.get('code'), item: p.get('item') }; })();

/* ---------- API ---------- */
async function get(action, params = {}) {
  const u = new URL(API.trim());
  u.searchParams.set('action', action);
  for (const k in params) u.searchParams.set(k, params[k]);
  const j = await (await fetch(u)).json();
  if (!j.ok) throw new Error(j.error);
  return j.data;
}
async function post(body) {
  if (S.pin && !ls('inv_pin')) {
    const p = prompt('Enter PIN');
    if (!p) throw new Error('PIN required');
    ls('inv_pin', p);
  }
  body.pin = ls('inv_pin') || '';
  body.by = body.by || ls('inv_by') || '';
  const r = await fetch(API.trim(), { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  const j = await r.json();
  if (!j.ok) { if (j.error === 'Wrong PIN') ls('inv_pin', null); throw new Error(j.error); }
  return j.data;
}

/* ---------- UTILS ---------- */
function ls(k, v) {
  try {
    if (v === undefined) return localStorage.getItem(k);
    if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v);
  } catch (e) { return null; }
}
function toast(m, err) {
  const t = $('#toast'); t.textContent = m; t.className = 'show' + (err ? ' err' : '');
  clearTimeout(t._t); t._t = setTimeout(() => t.className = '', 3500);
}
function noImg(el) { const d = document.createElement('div'); d.className = el.className + ' ph'; d.textContent = '🍽'; el.replaceWith(d); }
function thumb(src, cls = 'th') {
  return src ? `<img class="${cls}" src="${esc(src)}" loading="lazy" referrerpolicy="no-referrer" onerror="noImg(this)">`
             : `<div class="${cls} ph">🍽</div>`;
}
const rp = n => 'Rp ' + Math.round(n || 0).toLocaleString('id-ID');
const sgn = n => n > 0 ? '+' + n : String(n);
const nk = s => String(s || '').trim().toLowerCase();
const byRow = r => S.items.find(i => i.row == r);
const groupOf = name => S.groups.find(g => nk(g.item) === nk(name));
const codeOf = name => (groupOf(name) || {}).code || '';
const codeTag = c => c ? `<span class="code">${esc(c)}</span>` : '';
const withCode = name => { const c = codeOf(name); return (c ? c + ' · ' : '') + name; };
const priceOf = name => (groupOf(name) || {}).harga || 0;
const lossVal = l => l.value || l.qty * (l.price || priceOf(l.item));
const isLoss = l => l.type === 'BROKEN' || l.type === 'LOST';
const secIdx = s => { const i = S.secs.indexOf(s); return i < 0 ? 999 : i; };
const sortSec = rows => [...rows].sort((a, b) => secIdx(a.section) - secIdx(b.section));
const byCode = (a, b) => (a.code || '~').localeCompare(b.code || '~', undefined, { numeric: true }) || a.item.localeCompare(b.item);
const ym = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
const thisMonth = () => ym(new Date());
function monthLabel(m) { const [y, mo] = m.split('-'); return new Date(+y, +mo - 1, 1).toLocaleString('en', { month: 'long', year: 'numeric' }); }
const closedMonths = () => [...new Set(S.closings.map(c => c.month))].sort();
function compress(file) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, 1000 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = img.width * s; c.height = img.height * s;
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      res(c.toDataURL('image/jpeg', 0.75));
    };
    img.onerror = () => rej(new Error('Photo format not supported, choose another photo'));
    img.src = URL.createObjectURL(file);
  });
}
function previewOn(inputId, imgId) {
  $(inputId).onchange = e => {
    const f = e.target.files[0], p = $(imgId);
    if (f) { p.src = URL.createObjectURL(f); p.hidden = false; } else p.hidden = true;
  };
}

/* ---------- LOAD ---------- */
async function load() {
  $('#sub').textContent = 'Loading...';
  try {
    const [inv, log, cl] = await Promise.all([get('list'), get('log', { limit: 3000 }), get('closing')]);
    S.items = inv.items; S.secs = inv.sections || [];
    S.hasLost = inv.hasLost; S.hasPrice = inv.hasPrice; S.hasSection = inv.hasSection; S.hasTrf = inv.hasTrf;
    S.hasCode = inv.hasCode; S.codePrefix = inv.codePrefix || 'KU-';
    S.low = inv.lowStock; S.pin = inv.pinRequired; S.log = log; S.closings = cl;
    if (S.sec && S.secs.indexOf(S.sec) < 0) S.sec = '';
    buildGroups();
    fillSecs(); renderChips(); renderDash(); renderList(); fillItems(); renderHis(); renderCloseInfo(); renderRecap();
    if (!$('#lab').hidden) renderLabels();
    $('#sub').textContent = 'Updated ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    handleDeepLink();
  } catch (e) { toast(e.message, 1); $('#sub').textContent = 'Failed to load'; }
}

// Dibuka dari scan QR: ?code=KTC-001 atau ?item=Nama
function handleDeepLink() {
  if (!DEEP || (!DEEP.code && !DEEP.item)) return;
  const d = DEEP; DEEP = null;
  try { history.replaceState(null, '', APP_URL); } catch (e) {}
  const g = S.groups.find(g => (d.code && nk(g.code) === nk(d.code)) || (d.item && nk(g.item) === nk(d.item)));
  if (g) { tab('inv'); openItem(g.id); }
  else toast('Item ' + (d.code || d.item) + ' not found', 1);
}

function buildGroups() {
  const m = {}, order = [];
  S.items.forEach(r => {
    const k = nk(r.item);
    if (!m[k]) { m[k] = { item: r.item, code: '', no: r.no, photo: '', harga: 0, remarks: '', rows: [], total: 0, broken: 0, lost: 0 }; order.push(m[k]); }
    const g = m[k];
    g.rows.push(r); g.total += r.closing; g.broken += r.broken; g.lost += r.lost;
    if (!g.code && r.code) g.code = r.code;
    if (!g.photo && r.photo) g.photo = r.photo;
    if (!g.harga && r.harga) g.harga = r.harga;
    if (!g.remarks && r.remarks) g.remarks = r.remarks;
  });
  S.groups = order;
  S.groups.forEach((g, i) => { g.id = i; g.rows = sortSec(g.rows); });
}

function fillSecs() {
  const opts = S.secs.map(s => `<option>${esc(s)}</option>`).join('');
  const set = (id, first) => {
    const s = $(id), v = s.value;
    s.innerHTML = (first ? `<option value="">${first}</option>` : '') + opts;
    if (v && [...s.options].some(o => o.value === v)) s.value = v;

  set('#rSec', ''); set('#rTo', '— choose section —'); set('#hSec', 'All sections'); set('#cSec', 'All sections');
  set('#lSec', 'All items (one label per item)');

}

/* ---------- DASHBOARD ---------- */
function renderDash() {
  const mk = thisMonth(), mn = monthLabel(mk);
  const m = S.log.filter(l => l.ts.startsWith(mk));
  const sum = t => m.filter(l => l.type === t).reduce((a, l) => a + l.qty, 0);
  const loss = m.filter(isLoss);
  const lossTotal = loss.reduce((a, l) => a + lossVal(l), 0);
  const stock = S.items.reduce((a, i) => a + i.closing, 0);
  const low = S.items.filter(i => i.closing <= S.low).sort((a, b) => a.closing - b.closing);

  const byItem = {};
  loss.forEach(l => { const a = byItem[l.item] || (byItem[l.item] = { q: 0, v: 0 }); a.q += l.qty; a.v += lossVal(l); });
  const key = S.hasPrice ? 'v' : 'q';
  const top = Object.entries(byItem).sort((a, b) => b[1][key] - a[1][key]).slice(0, 5);
  const line = ([n, o]) => `<div class="row"><span>${codeTag(codeOf(n))}${esc(n)}</span><span><b>${o.q}</b> pcs${S.hasPrice ? ' · ' + rp(o.v) : ''}</span></div>`;

  let secHtml = '';
  if (S.hasSection) {
    const rows = S.secs.map(s => {
      const ls_ = loss.filter(l => l.loc === s);
      return {
        s, stock: S.items.filter(r => r.section === s).reduce((a, r) => a + r.closing, 0),
        broken: ls_.filter(l => l.type === 'BROKEN').reduce((a, l) => a + l.qty, 0),
        lost: ls_.filter(l => l.type === 'LOST').reduce((a, l) => a + l.qty, 0),
        v: ls_.reduce((a, l) => a + lossVal(l), 0)
      };
    });
    secHtml = `<div class="card"><h3>By section · ${mn}</h3><div class="tbl-wrap" style="margin:0"><table class="tbl">
      <thead><tr><th>Section</th><th class="n">Stock</th><th class="n">Broken</th><th class="n">Lost</th>${S.hasPrice ? '<th class="n">Loss value</th>' : ''}</tr></thead>
      <tbody>${rows.map(r => `<tr><td>${esc(r.s)}</td><td class="n">${r.stock}</td><td class="n">${r.broken}</td><td class="n">${r.lost}</td>${S.hasPrice ? `<td class="n">${rp(r.v)}</td>` : ''}</tr>`).join('')}</tbody>
    </table></div></div>`;
  }

  $('#dash').innerHTML = `
    <div class="stats">
      <div class="stat"><small>Items</small><b>${S.groups.length}</b></div>
      <div class="stat g"><small>Stock on hand</small><b>${stock}</b></div>
      <div class="stat r"><small>Broken · ${mn}</small><b>${sum('BROKEN')}</b></div>
      <div class="stat a"><small>Lost · ${mn}</small><b>${sum('LOST')}</b></div>
      ${S.hasPrice ? `<div class="stat r"><small>Loss value · ${mn}</small><b>${rp(lossTotal)}</b></div>` : ''}
      <div class="stat g"><small>Added · ${mn}</small><b>${sum('ADD')}</b></div>
    </div>
    ${S.hasSection ? '' : '<div class="card hint" style="margin:0 0 12px">Add a <b>SECTION</b> column to the sheet to split stock per section.</div>'}
    ${secHtml}
    <div class="card"><h3>Top broken / lost items · ${mn}</h3>
      ${top.length ? top.map(line).join('') : '<p class="empty">Nothing reported this month</p>'}
    </div>
    <div class="card"><h3>Low stock (≤ ${S.low})</h3>
      ${low.length ? low.map(i => `<div class="row"><span>${codeTag(codeOf(i.item))}${esc(i.item)}${i.section ? ' · <span style="color:var(--mute)">' + esc(i.section) + '</span>' : ''}</span><b style="color:var(--red)">${i.closing}</b></div>`).join('') : '<p class="empty">All items above minimum</p>'}
    </div>`;
}

function renderChips() {

  const all = [['', 'All sections'], ...S.secs.map(s => [s, s])];

function sortList(a, sort, stockKey) {
  if (sort === 'code') a.sort(byCode);
  if (sort === 'name') a.sort((x, y) => x.item.localeCompare(y.item));
  if (sort === 'low') a.sort((x, y) => x[stockKey] - y[stockKey]);
  if (sort === 'broken') a.sort((x, y) => (y.broken + y.lost) - (x.broken + x.lost));
  if (sort === 'price') a.sort((x, y) => y.harga - x.harga);
  return a;
}

function renderList() {
  const q = nk($('#q').value), sort = $('#sort').value;
  const match = (name, code) => nk(name).includes(q) || nk(code).includes(q);
  let html = '';
  if (!S.sec) {
    const a = sortList(S.groups.filter(g => match(g.item, g.code)), sort, 'total');
    html = a.map(g => {
      const low = g.rows.some(r => r.closing <= S.low);
      const r0 = g.rows[0];
      const per = S.hasSection
        ? g.rows.map(r => `${esc(r.section || '-')} <b>${r.closing}</b>`).join(' · ')

    }).join('');
  } else {
    const a = sortList(S.items.filter(r => r.section === S.sec && match(r.item, codeOf(r.item))).map(r => Object.assign({}, r, { code: codeOf(r.item) })), sort, 'closing');
    html = a.map(r => {
      const g = groupOf(r.item), low = r.closing <= S.low;
      return `<div class="item" onclick="openItem(${g.id})">${thumb(g.photo)}
        <div class="info"><b>${codeTag(r.code)}${esc(r.item)}</b>
          <div class="meta">Awal ${r.awal} · +${r.add}${r.trf ? ' · Trf ' + sgn(r.trf) : ''} · Broken ${r.broken}${S.hasLost ? ' · Lost ' + r.lost : ''}</div>
          ${S.hasPrice ? `<div class="meta">${r.harga ? rp(r.harga) + ' / pcs' : 'No price'}</div>` : ''}</div>
        <div class="qty ${low ? 'low' : ''}">${r.closing}<small>${low ? 'low' : 'in stock'}</small></div></div>`;
    }).join('');
  }
  $('#list').innerHTML = html || '<p class="empty">No items found</p>';
}

async function saveNew() {
  const name = $('#nName').value.trim(); if (!name) return toast('Item name is required', 1);

    document.querySelectorAll('.nSec').forEach(el => { if (el.value !== '') stocks[el.dataset.s] = +el.value || 0; });

/* ---------- QR LABELS ---------- */
function qrSvg(text) {
  const qr = qrcode(0, 'M');
  qr.addData(text);
  qr.make();
  const n = qr.getModuleCount(), m = 2;
  let d = '';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) d += `M${c + m} ${r + m}h1v1h-1z`;
  return `<svg class="lqr" viewBox="0 0 ${n + 2 * m} ${n + 2 * m}" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
}
function qrText(g) {
  if ($('#lMode').value === 'code') return g.code || g.item;
  return APP_URL + '?' + (g.code ? 'code=' + encodeURIComponent(g.code) : 'item=' + encodeURIComponent(g.item));
}
function openLabels(only) {
  closeModal();
  LBL.only = (only === undefined || only === null) ? null : only;
  LBL.skip.clear();
  if (LBL.only !== null) { $('#lQ').value = ''; $('#lSec').value = ''; }
  tab('lab');
}
function labelList() {
  const sec = $('#lSec').value, q = nk($('#lQ').value);
  let list;
  if (LBL.only !== null) {
    const g = S.groups[LBL.only];
    list = g ? [{ g, sec: '' }] : [];
  } else if (sec) {
    list = S.items.filter(r => r.section === sec).map(r => ({ g: groupOf(r.item), sec }));
  } else {
    list = S.groups.map(g => ({ g, sec: '' }));
  }
  list = list.filter(x => x.g && (nk(x.g.item).includes(q) || nk(x.g.code).includes(q)));
  list.sort((a, b) => byCode(a.g, b.g));
  return list.filter(x => !LBL.skip.has(x.g.item + '|' + x.sec));
}
function labelHtml(x, svg, size) {
  const g = x.g;
  const photo = `<div class="lph">${g.photo ? `<img src="${esc(g.photo)}" referrerpolicy="no-referrer" onerror="this.remove()">` : '🍽'}</div>`;
  if (size === 'qm' || size === 'qs') {
    return `
      <div class="qh"><b>KITCHEN UTENSILS</b><span>${esc(x.sec || 'Scan for details')}</span></div>
      <div class="qbody">
        <div class="qqr">${svg}</div>
        ${g.code ? `<div class="qcode">${esc(g.code)}</div>` : '<div class="qcode none">No code yet</div>'}
        <div class="qfoot">${photo}<div class="qname">${esc(g.item)}</div></div>
      </div>`;
  }
  return `
    <div class="lqrw">${svg}</div>
    <div class="lbody">
      ${size !== 's' ? photo : ''}
      <div class="lname">${esc(g.item)}</div>
      ${x.sec ? `<div class="lsec">${esc(x.sec)}</div>` : ''}
      ${g.code ? `<div class="lcode">${esc(g.code)}</div>` : '<div class="lcode none">No code yet</div>'}
    </div>`;
}
function renderLabels() {
  if (!window.qrcode) { toast('QR library not loaded, check internet connection', 1); return; }
  const size = $('#lSize').value;
  const isCard = size === 'qm' || size === 'qs';
  const copies = Math.max(1, Math.min(20, Math.round(+$('#lCopies').value || 1)));
  const list = labelList();
  LBL.cur = list;
  let html = '';
  list.forEach((x, i) => {
    let svg = '';
    try { svg = qrSvg(qrText(x.g)); } catch (e) { svg = '<div class="lcode none">QR error</div>'; }
    const inner = labelHtml(x, svg, size);
    for (let c = 0; c < copies; c++) {
      html += `<div class="lbl${isCard ? ' qc' : ''}">
        ${c === 0 ? `<button class="lx noprint" title="Hide this item" onclick="skipLabel(${i})">✕</button>` : ''}
        ${inner}
      </div>`;
    }
  });
  const box = $('#labels');
  box.className = 'labels l' + size;
  box.innerHTML = html || '<p class="empty noprint">No items to print</p>';

  const noCode = list.filter(x => !x.g.code).length;
  let info = `${list.length} item${list.length === 1 ? '' : 's'} × ${copies} = <b>${list.length * copies}</b> labels`;
  if (noCode) info += ` · <span style="color:var(--red)">${noCode} without code</span>`;
  if (LBL.skip.size) info += ` · ${LBL.skip.size} hidden <button class="link" onclick="LBL.skip.clear();renderLabels()">show</button>`;
  if (LBL.only !== null) info += ` · <button class="link" onclick="LBL.only=null;renderLabels()">show all items</button>`;
  $('#lInfo').innerHTML = info;
}
function skipLabel(i) {
  const x = LBL.cur[i]; if (!x) return;
  LBL.skip.add(x.g.item + '|' + x.sec);
  renderLabels();
}
async function printLabels() {
  const imgs = [...document.querySelectorAll('#labels img')];
  const btn = $('#lPrint'); btn.disabled = true; btn.textContent = 'Loading photos...';
  await Promise.race([
    Promise.all(imgs.map(im => im.complete ? 1 : new Promise(r => { im.onload = im.onerror = r; }))),
    new Promise(r => setTimeout(r, 5000))
  ]);
  btn.disabled = false; btn.textContent = 'Print labels';
  window.print();
}

  s.innerHTML = '<option value="">— choose item —</option>' + rows.map(r => `<option value="${r.row}">${esc(withCode(r.item))}</option>`).join('');
  if (cur) { const m = rows.find(r => nk(r.item) === nk(cur.item)); if (m) s.value = m.row; }
  showInfo();
}
function showInfo() {
  const i = byRow($('#rItem').value);
  let info = i ? `Current stock${i.section ? ' in ' + esc(i.section) : ''}: <b>${i.closing}</b>${S.hasPrice && i.harga ? ' · ' + rp(i.harga) + ' / pcs' : ''}` : '';
  if (i && S.type === 'TRANSFER') {
    const to = $('#rTo').value;

      info += ` · ${esc(to)}: <b>${t ? t.closing : 0}</b>${t ? '' : ' (new row will be created)'}`;
    }
  }
  $('#rInfo').innerHTML = info;
  const q = +$('#rQty').value;
  $('#rVal').innerHTML = (i && q > 0 && S.hasPrice && i.harga && (S.type === 'BROKEN' || S.type === 'LOST'))
    ? `Loss value: <b style="color:var(--red)">${rp(q * i.harga)}</b>` : '';
}
function setType(t) {

  const btn = $('#rSubmit');
  btn.textContent = { BROKEN: 'Report broken', LOST: 'Report lost', ADD: 'Add stock', TRANSFER: 'Transfer stock' }[t];

function goReport(id, t) {
  const g = S.groups[id];

function logRow(l) {
  if (l.type === 'CLOSE MONTH') {
    return `<div class="log"><span class="tag t-CLOSEMONTH">CLOSE</span>
      <div class="info"><b>Month closed</b> · ${l.qty} rows<div class="meta">${esc(l.ts)} · ${esc(l.by || '-')} · ${esc(l.note)}</div></div></div>`;
  }
  const trf = l.type.startsWith('TRANSFER');
  const tag = trf ? (l.type === 'TRANSFER IN' ? 'TRF IN' : 'TRF OUT') : l.type;
  const cls = trf ? 'TRF' : l.type.replace(/\s/g, '');
  const sign = ['ADD', 'NEW ITEM', 'TRANSFER IN'].includes(l.type) ? '+' : (isLoss(l) || l.type === 'TRANSFER OUT') ? '−' : '';
  const val = isLoss(l) && S.hasPrice ? ' · ' + rp(lossVal(l)) : '';
  return `<div class="log"><span class="tag t-${cls}">${esc(tag)}</span>
    <div class="info"><b>${codeTag(codeOf(l.item))}${esc(l.item)}</b> <span class="q">${sign}${l.qty}</span>${val}
      <div class="meta">${esc(l.ts)}${l.loc ? ' · ' + esc(l.loc) : ''} · ${esc(l.by || '-')}${l.note ? ' · ' + esc(l.note) : ''}</div></div>
    ${l.photo ? `<a href="${esc(l.photo)}" target="_blank">${thumb(l.photo, 'th sm')}</a>` : ''}</div>`;
}
function renderHis() {
  const t = $('#hType').value, m = $('#hMonth').value, sec = $('#hSec').value;

/* ---------- CLOSE MONTH ---------- */
function renderCloseInfo() {
  const ms = closedMonths(), last = ms[ms.length - 1];
  $('#closeInfo').innerHTML = last ? 'Last closed: <b>' + monthLabel(last) + '</b>' : 'No month closed yet';
}
function defaultCloseMonth() {
  const ms = closedMonths(), last = ms[ms.length - 1];
  const d = new Date();
  if (d.getDate() <= 15) { d.setDate(1); d.setMonth(d.getMonth() - 1); }
  let m = ym(d);
  if (last && m <= last) { const [y, mo] = last.split('-').map(Number); m = ym(new Date(y, mo, 1)); }
  return m > thisMonth() ? thisMonth() : m;
}
function openClose() {
  openModal(`
    <div class="mh"><h3>Close month</h3><button class="x" onclick="closeModal()">✕</button></div>
    <label>Month to close<input type="month" id="clM" value="${defaultCloseMonth()}" max="${thisMonth()}"></label>
    <div class="note">
      <b>What happens:</b><br>
      1. A snapshot is saved to tab <b>ARSIP yyyy-mm</b> and to the <b>CLOSING</b> history.<br>

      3. Additional, Transfer, Broken and Lost are reset to 0. Inputs made after the month ended are carried into the new month.<br>

/* ---------- RECAP ---------- */
const SIGS = [['s1', 'Prepared by'], ['s2', 'Checked by'], ['s3', 'Approved by']];
function sigs() { return SIGS.map(([k, label]) => ({ label, name: $('#' + k + 'n').value.trim(), role: $('#' + k + 'r').value.trim() })); }

function recapData() {
  const m = $('#cMonth').value || thisMonth(), sec = S.hasSection ? $('#cSec').value : '';
  const closed = S.closings.some(c => c.month === m);
  const TYPES = ['ADD', 'BROKEN', 'LOST', 'TRANSFER IN', 'TRANSFER OUT'];
  const logs = S.log.filter(l => l.ts.startsWith(m) && TYPES.includes(l.type) && (!sec || l.loc === sec));
  const agg = {}, order = [];
  const A = (name, no, price) => {
    const k = nk(name);
    if (!agg[k]) { agg[k] = { no: no || '', code: codeOf(name), item: name, price: price || 0, opening: 0, add: 0, trf: 0, broken: 0, lost: 0, value: 0, stock: 0 }; order.push(agg[k]); }
    if (!agg[k].price && price) agg[k].price = price;
    return agg[k];
  };
  if (closed) S.closings.filter(c => c.month === m && (!sec || c.section === sec)).forEach(c => { const a = A(c.item, c.no, c.harga); a.opening += c.awal; a.stock += c.closing; });
  else S.items.filter(r => !sec || r.section === sec).forEach(r => { const a = A(r.item, r.no, r.harga); a.opening += r.awal; a.stock += r.closing; });
  logs.forEach(l => {
    const a = A(l.item, '', l.price || priceOf(l.item));
    if (l.type === 'ADD') a.add += l.qty;
    else if (l.type === 'TRANSFER IN') a.trf += l.qty;
    else if (l.type === 'TRANSFER OUT') a.trf -= l.qty;
    else { a[l.type === 'BROKEN' ? 'broken' : 'lost'] += l.qty; a.value += lossVal(l); }
  });
  let rows = order;
  if (sec) rows = rows.filter(r => r.opening || r.stock || r.add || r.trf || r.broken || r.lost);
  if (S.hasCode) rows = [...rows].sort(byCode);

  const secList = S.hasSection ? (sec ? [sec] : S.secs) : [];
  const bySec = secList.map(s => {
    const o = { sec: s, opening: 0, add: 0, tin: 0, tout: 0, broken: 0, lost: 0, value: 0, stock: 0 };
    if (closed) S.closings.filter(c => c.month === m && c.section === s).forEach(c => { o.opening += c.awal; o.stock += c.closing; });
    else S.items.filter(r => r.section === s).forEach(r => { o.opening += r.awal; o.stock += r.closing; });
    S.log.filter(l => l.ts.startsWith(m) && l.loc === s).forEach(l => {
      if (l.type === 'ADD') o.add += l.qty;
      else if (l.type === 'TRANSFER IN') o.tin += l.qty;
      else if (l.type === 'TRANSFER OUT') o.tout += l.qty;
      else if (isLoss(l)) { o[l.type === 'BROKEN' ? 'broken' : 'lost'] += l.qty; o.value += lossVal(l); }
    });
    return o;
  });
  const t = rows.reduce((a, r) => {
    ['opening', 'add', 'trf', 'broken', 'lost', 'value', 'stock'].forEach(k => a[k] += r[k]); return a;
  }, { opening: 0, add: 0, trf: 0, broken: 0, lost: 0, value: 0, stock: 0 });
  return {
    m, sec, closed, rows, bySec, t,
    incidents: logs.filter(isLoss).slice().reverse(),
    transfers: logs.filter(l => l.type === 'TRANSFER OUT' || (sec && l.type === 'TRANSFER IN')).slice().reverse()
  };
}

      <tbody>${d.bySec.map(s => `<tr><td>${esc(s.sec)}</td><td class="n">${s.opening}</td><td class="n">${s.add}</td><td class="n">${s.tin}</td><td class="n">${s.tout}</td><td class="n">${s.broken}</td><td class="n">${s.lost}</td>${P ? `<td class="n">${rp(s.value)}</td>` : ''}<td class="n">${s.stock}</td></tr>`).join('')}</tbody>
    </table></div>` : '';

  const incTbl = `<h4>${++no + 1}. Incident detail (broken / lost)</h4>
    <div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>Date</th><th>Type</th>${K ? '<th>Code</th>' : ''}<th>Item</th>${S.hasSection ? '<th>Section</th>' : ''}<th class="n">Qty</th>${P ? '<th class="n">Value</th>' : ''}<th>Reported by</th><th>Note</th></tr></thead>
      <tbody>${d.incidents.map(l => `<tr><td>${esc(l.ts)}</td><td>${l.type}</td>${K ? `<td>${esc(codeOf(l.item))}</td>` : ''}<td>${esc(l.item)}</td>${S.hasSection ? `<td>${esc(l.loc || '-')}</td>` : ''}<td class="n">${l.qty}</td>${P ? `<td class="n">${rp(lossVal(l))}</td>` : ''}<td>${esc(l.by || '-')}</td><td>${esc(l.note)}</td></tr>`).join('') || `<tr><td colspan="9" class="empty">No incidents</td></tr>`}</tbody>
    </table></div>`;

  const trfTbl = S.hasSection ? `<h4>${++no + 1}. Transfers</h4>

      <tbody>${d.transfers.map(l => `<tr><td>${esc(l.ts)}</td><td>${l.type === 'TRANSFER IN' ? 'IN' : 'OUT'}</td>${K ? `<td>${esc(codeOf(l.item))}</td>` : ''}<td>${esc(l.item)}</td><td>${esc(l.loc)}</td><td class="n">${l.qty}</td><td>${esc(l.note)}</td><td>${esc(l.by || '-')}</td></tr>`).join('') || `<tr><td colspan="8" class="empty">No transfers</td></tr>`}</tbody>
    </table></div>` : '';

  $('#rpt').innerHTML = `
    <div class="rh">

      <div><small>Lost</small><b>${d.t.lost}</b></div>

    </div>
    <h4>1. Summary per item${d.sec ? ' – ' + esc(d.sec) : (S.hasSection ? ' (all sections combined)' : '')}</h4>
    <div class="tbl-wrap"><table class="tbl">

function downloadXls() {
  if (!window.XLSX) return toast('Excel library not loaded, check internet connection', 1);
  const d = recapData(), P = S.hasPrice, C = d.closed, T = !!d.sec, K = S.hasCode, sg = sigs();
  const head = [['KITCHEN UTENSILS - LOST & BREAKAGE REPORT'], ['Period', monthLabel(d.m)],
    ['Section', d.sec || (S.hasSection ? 'All sections' : '-')],
    ['Status', C ? 'Month closed' : 'Month not closed - stock is current stock'], []];

  const h1 = ['NO', ...(K ? ['CODE'] : []), 'ITEM', ...(P ? ['PRICE'] : []), 'OPENING', 'ADDED', ...(T ? ['TRANSFER'] : []), 'BROKEN', 'LOST', ...(P ? ['LOSS VALUE'] : []), C ? 'CLOSING STOCK' : 'CURRENT STOCK'];
  const s1 = head.concat([h1]);
  d.rows.forEach((r, i) => s1.push([i + 1, ...(K ? [r.code] : []), r.item, ...(P ? [r.price] : []), r.opening, r.add, ...(T ? [r.trf] : []), r.broken, r.lost, ...(P ? [r.value] : []), r.stock]));
  s1.push(['', ...(K ? [''] : []), 'TOTAL', ...(P ? [''] : []), d.t.opening, d.t.add, ...(T ? [d.t.trf] : []), d.t.broken, d.t.lost, ...(P ? [d.t.value] : []), d.t.stock]);
  s1.push([], [], [sg[0].label, '', '', sg[1].label, '', '', sg[2].label], [], [], [],
    [sg[0].name, '', '', sg[1].name, '', '', sg[2].name], [sg[0].role, '', '', sg[1].role, '', '', sg[2].role]);

  const wb = XLSX.utils.book_new();
  const add = (aoa, name, cols) => { const ws = XLSX.utils.aoa_to_sheet(aoa); ws['!cols'] = cols.map(w => ({ wch: w })); XLSX.utils.book_append_sheet(wb, ws, name); };
  add(s1, 'Summary', [16, ...(K ? [10] : []), 32, 12, 10, 9, 10, 9, 9, 14, 14]);

  if (d.bySec.length) {
    const s2 = head.concat([['SECTION', 'OPENING', 'ADDED', 'TRF IN', 'TRF OUT', 'BROKEN', 'LOST', ...(P ? ['LOSS VALUE'] : []), C ? 'CLOSING' : 'CURRENT']]);
    d.bySec.forEach(s => s2.push([s.sec, s.opening, s.add, s.tin, s.tout, s.broken, s.lost, ...(P ? [s.value] : []), s.stock]));
    add(s2, 'By Section', [22, 10, 9, 9, 9, 9, 9, 14, 10]);
  }

  const s3 = head.concat([['DATE', 'TYPE', ...(K ? ['CODE'] : []), 'ITEM', ...(S.hasSection ? ['SECTION'] : []), 'QTY', ...(P ? ['PRICE', 'VALUE'] : []), 'REPORTED BY', 'NOTE']]);
  d.incidents.forEach(l => s3.push([l.ts, l.type, ...(K ? [codeOf(l.item)] : []), l.item, ...(S.hasSection ? [l.loc] : []), l.qty, ...(P ? [l.price || priceOf(l.item), lossVal(l)] : []), l.by, l.note]));
  add(s3, 'Incidents', [17, 9, ...(K ? [10] : []), 28, 18, 6, 12, 12, 16, 30]);

  if (S.hasSection) {
    const s4 = head.concat([['DATE', 'TYPE', ...(K ? ['CODE'] : []), 'ITEM', 'SECTION', 'QTY', 'DETAIL', 'BY']]);
    d.transfers.forEach(l => s4.push([l.ts, l.type, ...(K ? [codeOf(l.item)] : []), l.item, l.loc, l.qty, l.note, l.by]));
    add(s4, 'Transfers', [17, 13, ...(K ? [10] : []), 28, 18, 6, 30, 16]);
  }
  XLSX.writeFile(wb, 'Lost-Breakage-' + d.m + (d.sec ? '-' + d.sec.replace(/\W+/g, '_') : '') + '.xlsx');
}
