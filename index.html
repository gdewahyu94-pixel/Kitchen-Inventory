<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kitchen Inventory</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
:root{--bg:#f4f5f3;--card:#fff;--ink:#1d2621;--mute:#6a756e;--line:#e1e5e1;--pri:#1f6f54;--pri2:#e5f1ec;--red:#c0392b;--red2:#fbecea;--amb:#b26b00;--amb2:#fdf3e1;--blu:#2b5797;--blu2:#e8eef7}
*{box-sizing:border-box}
body{margin:0;font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
[hidden]{display:none!important}
.top{position:sticky;top:0;z-index:5}
header{background:var(--pri);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
header h1{font-size:17px;margin:0}header small{opacity:.85;font-size:12px}
.role{display:inline-block;background:rgba(255,255,255,.2);border-radius:4px;padding:0 6px;margin-right:6px;font-weight:600}
.hbtns{display:flex;gap:8px}
.icon{background:rgba(255,255,255,.15);border:0;color:#fff;font-size:15px;min-width:36px;height:36px;border-radius:8px;cursor:pointer;padding:0 10px;font-weight:600}
nav{display:flex;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto}
nav button{flex:1;border:0;background:none;padding:12px 4px;font:inherit;font-size:12.5px;color:var(--mute);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--pri);border-color:var(--pri);font-weight:600}
main{max-width:900px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.stat small{color:var(--mute);font-size:12px}.stat b{display:block;font-size:22px;margin-top:2px}
.stat.r b{color:var(--red)}.stat.a b{color:var(--amb)}.stat.g b{color:var(--pri)}
h3{margin:0 0 10px;font-size:15px}h4{margin:18px 0 8px;font-size:14px}
.bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.bar input,.bar select{flex:1;min-width:130px;width:auto}
input,select,textarea{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:12px}
label input,label select,label textarea{margin-top:4px}
.check{display:flex;gap:8px;align-items:center;margin:0;font-size:13px;color:var(--ink)}
.check input{width:auto;margin:0}
.btn{border:0;border-radius:8px;padding:10px 14px;font:inherit;font-weight:600;background:var(--pri);color:#fff;cursor:pointer;white-space:nowrap}
.btn.red{background:var(--red)}.btn.amb{background:var(--amb)}.btn.blu{background:var(--blu)}.btn.ghost{background:var(--pri2);color:var(--pri)}
.btn.full{width:100%}.btn.lg{padding:14px;font-size:16px}.btn.xl{padding:22px 10px;font-size:19px;border-radius:12px}.btn:disabled{opacity:.6}
.link{border:0;background:none;color:var(--pri);font:inherit;font-size:13px;font-weight:600;cursor:pointer;padding:0;text-decoration:underline}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:7px 14px;font:inherit;font-size:13px;white-space:nowrap;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.code{display:inline-block;font-size:11px;font-weight:700;color:var(--blu);background:var(--blu2);border-radius:4px;padding:1px 6px;margin-right:6px;vertical-align:1px;letter-spacing:.3px}
.who{display:flex;gap:8px;align-items:center;background:var(--pri2);border-radius:8px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.who svg{flex:none}
.tbanner{border-radius:8px;padding:10px 12px;font-weight:700;margin-bottom:12px;text-align:center}
.tbanner.BROKEN{background:var(--red2);color:var(--red)}.tbanner.LOST{background:var(--amb2);color:var(--amb)}
.item,.log{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.item{cursor:pointer}
.th{width:56px;height:56px;border-radius:8px;object-fit:cover;flex:none;background:var(--pri2)}
.th.sm{width:44px;height:44px}
.ph{display:flex;align-items:center;justify-content:center;font-size:22px}
.info{flex:1;min-width:0}.meta{color:var(--mute);font-size:12px;margin-top:2px}
.meta b{color:var(--ink)}
.qty{text-align:center;font-size:22px;font-weight:700;color:var(--pri);min-width:60px}
.qty small{display:block;font-size:11px;font-weight:500;color:var(--mute)}
.qty.low{color:var(--red)}
.neg{color:var(--red)!important}.pos{color:var(--pri)!important}
.seg{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.seg button{flex:1;padding:10px 6px;border:1px solid var(--line);background:#fff;border-radius:8px;font:inherit;font-size:14px;cursor:pointer;color:var(--mute)}
.seg button.on[data-t=BROKEN]{background:var(--red2);border-color:var(--red);color:var(--red);font-weight:600}
.seg button.on[data-t=LOST]{background:var(--amb2);border-color:var(--amb);color:var(--amb);font-weight:600}
.seg button.on[data-t=ADD]{background:var(--pri2);border-color:var(--pri);color:var(--pri);font-weight:600}
.seg button.on[data-t=TRANSFER]{background:var(--blu2);border-color:var(--blu);color:var(--blu);font-weight:600}
.hint{font-size:13px;margin:-6px 0 12px;color:var(--mute)}
.note{font-size:13px;color:var(--ink);background:var(--bg);border-radius:8px;padding:12px;margin-bottom:12px;line-height:1.5}
.prev{max-width:160px;border-radius:8px;margin-bottom:12px;display:block}
.picked{display:flex;gap:10px;align-items:center;background:var(--pri2);border-radius:10px;padding:8px;margin:-4px 0 12px}
.picked img,.picked .ph{width:48px;height:48px;border-radius:8px;object-fit:cover;background:#fff;flex:none}
.qitem{text-align:center;margin-bottom:14px}
.qitem h2{margin:6px 0 2px;font-size:20px}
.pin{text-align:center;font-size:24px;letter-spacing:8px}
.qhero{display:flex;justify-content:space-between;align-items:center;background:var(--pri2);border-radius:10px;padding:12px 14px;margin-bottom:10px;text-align:left}
.qhero small{display:block;font-size:12px;color:var(--mute)}
.qhero b.n{font-size:32px;line-height:1;color:var(--pri)}
.qhero b.n.low{color:var(--red)}
.qstats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.qstats div{border:1px solid var(--line);border-radius:8px;padding:8px 4px;text-align:center}
.qstats small{display:block;font-size:11px;color:var(--mute)}
.qstats b{font-size:17px}
.qstats .r b{color:var(--red)}.qstats .a b{color:var(--amb)}.qstats .g b{color:var(--pri)}.qstats .bl b{color:var(--blu)}
.tbl tr.cur td{background:#f3faf6;font-weight:700}
.done{text-align:center;padding:28px 16px}
.done .ok{width:64px;height:64px;border-radius:50%;background:var(--pri2);color:var(--pri);font-size:34px;line-height:64px;margin:0 auto 10px;font-weight:700}
.tag{font-size:11px;font-weight:700;padding:4px 6px;border-radius:6px;flex:none;width:72px;text-align:center}
.t-BROKEN{background:var(--red2);color:var(--red)}.t-LOST{background:var(--amb2);color:var(--amb)}
.t-ADD,.t-NEWITEM{background:var(--pri2);color:var(--pri)}.t-CLOSEMONTH,.t-TRF{background:var(--blu2);color:var(--blu)}
.q{font-weight:700}
.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}.row:last-child{border:0}
.row span:last-child{text-align:right;white-space:nowrap}
.empty{color:var(--mute);text-align:center;padding:20px;font-size:14px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:#fff;width:100%;max-width:600px;max-height:90vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
@media(min-width:600px){.modal{align-items:center}.sheet{border-radius:16px}}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.mh h3{margin:0;font-size:17px}
.x{border:0;background:var(--bg);width:32px;height:32px;border-radius:8px;cursor:pointer}
.big{width:100%;max-height:240px;object-fit:contain;background:var(--bg);border-radius:10px;margin-bottom:12px}
.acts{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}.acts .btn{flex:1}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.flex{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,120px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;transition:.25s;z-index:40;font-size:14px;max-width:90vw}
#toast.show{transform:translate(-50%,0)}#toast.err{background:var(--red)}
.login{position:fixed;inset:0;background:var(--pri);z-index:30;display:flex;align-items:center;justify-content:center;padding:16px}
.lcard{background:#fff;border-radius:16px;padding:28px 22px;width:100%;max-width:340px;text-align:center}
.lcard h2{margin:0 0 4px;font-size:20px}
.lcard input{text-align:center;font-size:22px;letter-spacing:6px;margin:16px 0 12px}
#qrReader{width:100%;border-radius:10px;overflow:hidden;background:#000}
.tbl-wrap{overflow-x:auto;margin-bottom:16px}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th,.tbl td{border:1px solid #cfd6d1;padding:5px 6px;text-align:left;vertical-align:top}
.tbl th{background:var(--pri2);font-weight:600;white-space:nowrap}
.tbl .n{text-align:right;white-space:nowrap}
.tbl tfoot td{font-weight:700;background:var(--bg)}
.tbl.write td{height:8mm;vertical-align:middle}
.rh{text-align:center;margin-bottom:14px}.rh h2{margin:0 0 4px;font-size:17px}.rh div{font-size:13px;color:var(--mute)}
.rsum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.rsum div{border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center}
.rsum small{display:block;font-size:11px;color:var(--mute)}.rsum b{font-size:15px}
.rpt h4{margin:6px 0 6px}
.sigs{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:28px;text-align:center;font-size:13px;page-break-inside:avoid}
.sigs .ln{height:64px;border-bottom:1px solid var(--ink);margin:6px 8px 4px}
.orow{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:6px}
.orow.ok{border-color:#9fd3bd;background:#f3faf6}
.orow.diff{border-color:#f0b4ad;background:#fff7f6}
.ocnt{width:92px;flex:none;text-align:center;font-weight:700;font-size:16px}
.osticky{position:sticky;bottom:0;z-index:3;box-shadow:0 -4px 14px rgba(0,0,0,.06)}
.labels{display:grid;gap:2mm;justify-content:center}
.labels.lqm{grid-template-columns:repeat(auto-fill,60mm)}
.labels.lqs{grid-template-columns:repeat(auto-fill,45mm)}
.labels.lm{grid-template-columns:repeat(auto-fill,60mm)}
.labels.ll{grid-template-columns:repeat(auto-fill,90mm)}
.labels.ls{grid-template-columns:repeat(auto-fill,44mm)}
.lbl{position:relative;background:#fff;border:1px dashed #b9c2bc;border-radius:2mm;display:flex;gap:2.5mm;padding:2.5mm;overflow:hidden;break-inside:avoid;page-break-inside:avoid;color:#000}
.lqm .lbl{width:60mm;height:85mm}.lqs .lbl{width:45mm;height:65mm}
.lm .lbl{width:60mm;height:38mm}.ll .lbl{width:90mm;height:50mm}.ls .lbl{width:44mm;height:28mm;padding:2mm;gap:2mm}
.lqr{width:100%;height:auto;display:block}
.lph{flex:none;border-radius:1.5mm;background:#f1f3f1;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:14px}
.lph img{width:100%;height:100%;object-fit:cover}
.lx{position:absolute;top:1mm;right:1mm;border:0;background:#fbecea;color:#c0392b;border-radius:50%;width:20px;height:20px;font-size:11px;cursor:pointer;line-height:20px;padding:0;z-index:2}
.lbl.qc{flex-direction:column;padding:0;gap:0;border-radius:3mm;border:1px solid #cfd6d1}
.qh{background:#1f6f54;color:#fff;text-align:center;padding:2.2mm 2mm 1.8mm;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.qh b{display:block;font-size:8.5pt;letter-spacing:1px}
.qh span{display:block;font-size:7pt;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:.3mm}
.lqs .qh{padding:1.6mm 1.5mm 1.2mm}.lqs .qh b{font-size:7pt}.lqs .qh span{font-size:6pt}
.qbody{flex:1;display:flex;flex-direction:column;align-items:center;padding:2.5mm 3mm 2.5mm;gap:1.2mm;min-height:0}
.lqs .qbody{padding:2mm 2.5mm;gap:1mm}
.qqr{width:48mm}.lqs .qqr{width:36mm}
.qcode{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;font-size:12pt;letter-spacing:1.5px}
.lqs .qcode{font-size:9pt;letter-spacing:1px}
.qcode.none{color:#c0392b;font-family:inherit;font-weight:500;font-size:8pt;letter-spacing:0}
.qfoot{display:flex;align-items:center;gap:2mm;width:100%;margin-top:auto;border-top:1px dashed #ccc;padding-top:1.8mm}
.qfoot .lph{width:11mm;height:11mm}.lqs .qfoot .lph{width:8mm;height:8mm;font-size:10px}
.qname{flex:1;min-width:0;font-weight:700;font-size:9pt;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.lqs .qname{font-size:7pt}
.lqrw{flex:none;display:flex;align-items:center;justify-content:center}
.lm .lqrw{width:31mm}.ll .lqrw{width:43mm}.ls .lqrw{width:23mm}
.lbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:1mm}
.lm .lph{width:13mm;height:13mm}.ll .lph{width:22mm;height:22mm}
.lname{font-weight:700;font-size:8.5pt;line-height:1.15;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.ll .lname{font-size:11pt}.ls .lname{font-size:7.5pt}
.lsec{font-size:6.5pt;color:#555}.ll .lsec{font-size:8.5pt}
.lcode{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;font-size:9pt;margin-top:auto;letter-spacing:.3px}
.ll .lcode{font-size:12pt}.ls .lcode{font-size:8pt}
.lcode.none{color:#c0392b;font-family:inherit;font-weight:500;font-size:7pt}
@media(max-width:520px){.rsum{grid-template-columns:repeat(2,1fr)}}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff}
  .top,.noprint,#toast,#modal,#login{display:none!important}
  main{padding:0;max-width:none}
  #rpt,#opRpt{border:0;padding:0;margin:0}
  .tbl th,.lph,.qh{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .tbl-wrap{overflow:visible}
  .labels{justify-content:start}
  .lbl{border:1px dashed #999}
  .lbl.qc{border:1px solid #999}
}
</style>
</head>
<body>
<div id="login" class="login" hidden>
  <div class="lcard">
    <h2>Kitchen Inventory</h2>
    <div class="meta">Enter your PIN to continue</div>
    <input id="lgPin" type="password" inputmode="numeric" autocomplete="off" placeholder="••••">
    <button class="btn full lg" id="lgBtn">Login</button>
  </div>
</div>

<div class="top">
  <header>
    <div><h1>Kitchen Inventory</h1><small><span class="role" id="roleTag">-</span><span id="sub">Inventory · Lost · Breakage</span></small></div>
    <div class="hbtns" id="hbtns">
      <button class="icon" id="refresh" title="Refresh">↻</button>
      <button class="icon" id="logoutBtn" title="Logout">Logout</button>
    </div>
  </header>
  <nav id="nav" hidden>
    <button data-tab="dash" class="on">Dashboard</button>
    <button data-tab="inv">Inventory</button>
    <button data-tab="rep">Input</button>
    <button data-tab="opn">Opname</button>
    <button data-tab="his">History</button>
    <button data-tab="rec">Recap</button>
  </nav>
</div>

<main>
  <section id="dash"><p class="empty">Loading...</p></section>

  <!-- QR mode: item detail + Broken / Lost, PIN asked after tapping a button -->
  <section id="qrv" hidden>
    <div class="card" id="qrCard">
      <div id="qItem"><p class="empty">Loading item...</p></div>
      <label id="qSecWrap" hidden>Section<select id="qSec"></select></label>
      <div id="qPick" class="two">
        <button type="button" class="btn red xl" id="qBtnB">Broken</button>
        <button type="button" class="btn amb xl" id="qBtnL">Lost</button>
      </div>
      <div id="qForm" hidden>
        <div class="tbanner" id="qBanner"></div>
        <div class="who" id="qWho"></div>
        <label>Quantity<input id="qQty" type="number" min="1" step="1" inputmode="numeric"></label>
        <label id="qReasonWrap">Cause<select id="qReason"></select></label>
        <label>Note<textarea id="qNote" rows="2" placeholder="e.g. table 12, dinner service"></textarea></label>
        <label>Photo (optional)<input id="qPhoto" type="file" accept="image/*"></label>
        <img id="qPrev" class="prev" hidden>
        <button type="button" class="btn full red lg" id="qSubmit">Report broken</button>
        <button type="button" class="btn ghost full" id="qCancel" style="margin-top:8px">Cancel</button>
      </div>
    </div>
    <div class="card done" id="qDone" hidden></div>
  </section>

  <section id="inv" hidden>
    <div class="chips" id="secChips"></div>
    <div class="bar">
      <input id="q" placeholder="Search name or code...">
      <select id="sort">
        <option value="no">Sheet order</option>
        <option value="code">Code</option>
        <option value="name">Name A–Z</option>
        <option value="low">Lowest stock</option>
        <option value="broken">Most broken/lost</option>
        <option value="price">Highest price</option>
      </select>
      <button class="btn ghost" id="lblBtn">QR Labels</button>
      <button class="btn" id="newBtn">+ New item</button>
    </div>
    <div id="list"></div>
  </section>

  <section id="rep" hidden>
    <form id="repForm" class="card">
      <button type="button" class="btn blu full lg" id="scanBtn" style="margin-bottom:14px">Scan QR label</button>
      <div class="seg" id="seg">
        <button type="button" data-t="BROKEN" class="on">Broken</button>
        <button type="button" data-t="LOST">Lost</button>
        <button type="button" data-t="ADD" id="segAdd">Add</button>
        <button type="button" data-t="TRANSFER" id="segTrf">Transfer</button>
      </div>
      <label id="rSecWrap"><span id="rSecLbl">Section</span><select id="rSec"></select></label>
      <label>Item<select id="rItem" required></select></label>
      <div id="rPicked"></div>
      <div id="rInfo" class="hint"></div>
      <div class="two">
        <label>Quantity<input id="rQty" type="number" min="1" step="1" inputmode="numeric" required></label>
        <label id="rToWrap" hidden>To section<select id="rTo"></select></label>
      </div>
      <label id="rReasonWrap">Cause<select id="rReason"></select></label>
      <div id="rVal" class="hint"></div>
      <label id="rByWrap">Reported by<input id="rBy"></label>
      <div class="who" id="rWho" hidden></div>
      <label>Note<textarea id="rNote" rows="2" placeholder="e.g. table 12, dinner service"></textarea></label>
      <div id="rPhotoWrap">
        <label>Photo (optional)<input id="rPhoto" type="file" accept="image/*"></label>
        <img id="rPrev" class="prev" hidden>
      </div>
      <button class="btn full red lg" id="rSubmit">Report broken</button>
    </form>
  </section>

  <section id="opn" hidden>
    <div class="noprint">
      <div class="card">
        <h3>Stock opname</h3>
        <div class="bar">
          <select id="oSec"></select>
          <input id="oQ" placeholder="Search or scan code...">
          <button class="btn blu" id="oScan">Scan QR</button>
        </div>
        <div class="flex">
          <label class="check"><input type="checkbox" id="oBlind"> Blind count sheet (hide system stock)</label>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn ghost" id="oSheet">Print count sheet</button>
            <button class="btn ghost" id="oClear">Clear counts</button>
          </div>
        </div>
      </div>
      <div id="oList"></div>
      <div class="card osticky">
        <div class="meta" id="oSum" style="margin:0 0 10px"></div>
        <div class="two">
          <input id="oBy" placeholder="Counted by">

<div id="modal" class="modal" hidden><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbxzVhZFbhwYKZKc8Ui2c8DiAAoowoC39D9UYmbTfchxQvI_-DmDwPE-QQADeUI0cNOY/exec';

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S = { role: '', qrKey: '', me: '', items: [], groups: [], log: [], secs: [], closings: [], reasons: [], hasLost: false, hasPrice: false,
          hasSection: false, hasTrf: false, hasCode: false, hasMin: false, codePrefix: 'KU-', low: 5, type: 'BROKEN', sec: '' };
let LBL = { only: null, skip: new Set(), cur: [] };
let OP = { sec: null, counts: {} };
let SCN = null;
const APP_URL = location.href.split(/[?#]/)[0];
const URLP = new URLSearchParams(location.search);
let DEEP = { code: URLP.get('code'), item: URLP.get('item'), sec: URLP.get('sec') };
const QR = { key: URLP.get('k') || '', g: null, fixedSec: '', type: 'BROKEN', pin: '', name: '' };
const isSpv = () => S.role === 'spv';
const USER_SVG = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1f6f54" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 4-6 8-6s8 2 8 6"></path></svg>';
const whoHtml = name => `${USER_SVG}<div>Reported by: <b>${esc(name)}</b><div class="meta">Locked to your PIN</div></div>`;

/* ---------- API ---------- */
async function get(action, params = {}, pinOverride) {
  const u = new URL(API.trim());
  u.searchParams.set('action', action);
  u.searchParams.set('pin', pinOverride || ls('inv_pin') || '');
  for (const k in params) u.searchParams.set(k, params[k]);
  const j = await (await fetch(u)).json();
  if (!j.ok) { if (j.error === 'Wrong PIN' && !pinOverride) logout(true); throw new Error(j.error); }
  return j.data;
}
async function post(body) {
  const override = !!body.pin;
  body.pin = body.pin || ls('inv_pin') || '';
  if (isSpv()) body.by = body.by || ls('inv_by') || '';
  const r = await fetch(API.trim(), { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  const j = await r.json();
  if (!j.ok) { if (j.error === 'Wrong PIN' && !override) logout(true); throw new Error(j.error); }
  return j.data;
}

/* ---------- LOGIN ---------- */
function showLogin() { $('#login').hidden = false; $('#lgPin').value = ''; setTimeout(() => $('#lgPin').focus(), 100); }
async function doLogin() {
  const pin = $('#lgPin').value.trim();
  if (!pin) return toast('Enter PIN', 1);
  const btn = $('#lgBtn'); btn.disabled = true; btn.textContent = 'Checking...';
  try {
    const r = await post({ action: 'login', pin });
    if (r.role === 'qr') throw new Error('Wrong PIN');
    ls('inv_pin', pin); ls('inv_role', r.role); S.role = r.role; S.me = r.name || '';
    $('#login').hidden = true;
    toast(r.role === 'spv' ? 'Logged in as Supervisor' : 'Hi, ' + r.name);
    applyRole(); tab(isSpv() ? 'dash' : 'rep');
    await load();
  } catch (e) { toast(e.message === 'Wrong PIN' ? 'Wrong PIN' : e.message, 1); }
  finally { btn.disabled = false; btn.textContent = 'Login'; }
}
function logout(silent) {
  ls('inv_pin', null); ls('inv_role', null); S.role = ''; S.me = '';
  closeModal();
  if (!silent) toast('Logged out');
  showLogin();
}
function applyRole() {
  if (S.role === 'qr') return;
  const spv = isSpv();
  $('#nav').hidden = !spv;
  $('#roleTag').textContent = spv ? 'Supervisor' : 'Staff';
  $('#segAdd').hidden = !spv;
  $('#segTrf').hidden = !spv || !S.hasSection;
  $('#rByWrap').hidden = !spv;
  $('#rWho').hidden = spv || !S.me;
  if (!spv && S.me) $('#rWho').innerHTML = whoHtml(S.me);
  if (!spv) {
    if (S.type !== 'BROKEN' && S.type !== 'LOST') setType('BROKEN');
    if (currentTab() !== 'rep') tab('rep');
  }
}
function currentTab() { const s = [...document.querySelectorAll('main section')].find(x => !x.hidden); return s ? s.id : ''; }

/* ---------- UTILS ---------- */
function ls(k, v) {
  try {
    if (v === undefined) return localStorage.getItem(k);
    if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v);
  } catch (e) { return null; }
}
function toast(m, err) {
  const t = $('#toast'); t.textContent = m; t.className = 'show' + (err ? ' err' : '');
  clearTimeout(t._t); t._t = setTimeout(() => t.className = '', 4000);
}
function noImg(el) { const d = document.createElement('div'); d.className = el.className + ' ph'; d.textContent = '🍽'; el.replaceWith(d); }
function thumb(src, cls = 'th') {
  return src ? `<img class="${cls}" src="${esc(src)}" loading="lazy" referrerpolicy="no-referrer" onerror="noImg(this)">`
             : `<div class="${cls} ph">🍽</div>`;
}
const rp = n => (n < 0 ? '−' : '') + 'Rp ' + Math.round(Math.abs(n || 0)).toLocaleString('id-ID');
const sgn = n => n > 0 ? '+' + n : String(n);
const nk = s => String(s || '').trim().toLowerCase();
const byRow = r => S.items.find(i => i.row == r);
const groupOf = name => S.groups.find(g => nk(g.item) === nk(name));
const codeOf = name => (groupOf(name) || {}).code || '';
const codeTag = c => c ? `<span class="code">${esc(c)}</span>` : '';
const withCode = name => { const c = codeOf(name); return (c ? c + ' · ' : '') + name; };
const priceOf = name => (groupOf(name) || {}).harga || 0;
const lossVal = l => l.value || l.qty * (l.price || priceOf(l.item));
const isLoss = l => l.type === 'BROKEN' || l.type === 'LOST';
const minOf = r => (S.hasMin && r.min > 0) ? r.min : S.low;
const isLow = r => r.closing <= minOf(r);
const secIdx = s => { const i = S.secs.indexOf(s); return i < 0 ? 999 : i; };
const sortSec = rows => [...rows].sort((a, b) => secIdx(a.section) - secIdx(b.section));
const byCode = (a, b) => (a.code || '~').localeCompare(b.code || '~', undefined, { numeric: true }) || a.item.localeCompare(b.item);
const ym = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
const thisMonth = () => ym(new Date());
function monthLabel(m) { const [y, mo] = m.split('-'); return new Date(+y, +mo - 1, 1).toLocaleString('en', { month: 'long', year: 'numeric' }); }
const closedMonths = () => [...new Set(S.closings.map(c => c.month))].sort();
function parseScan(txt) {
  txt = String(txt || '').trim();
  try {
    const u = new URL(txt);
    return { code: u.searchParams.get('code') || '', item: u.searchParams.get('item') || '', sec: u.searchParams.get('sec') || '' };
  } catch (e) { return { code: txt, item: '', sec: '' }; }
}
const scanCode = v => { const p = parseScan(v); return /^https?:/i.test(String(v).trim()) ? (p.code || p.item) : v; };
function findGroup(p) {
  p = p || {};
  return S.groups.find(g => (p.code && nk(g.code) === nk(p.code)) || (p.item && nk(g.item) === nk(p.item)) || (!p.item && p.code && nk(g.item) === nk(p.code)));
}
function sigBlock(labels, names) {
  return `<div class="sigs">${labels.map((l, i) => `<div>${l}<div class="ln"></div><b>${esc((names && names[i]) || '') || '&nbsp;'}</b></div>`).join('')}</div>`;
}
function compress(file) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, 1000 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = img.width * s; c.height = img.height * s;
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      res(c.toDataURL('image/jpeg', 0.75));
    };
    img.onerror = () => rej(new Error('Photo format not supported, choose another photo'));
    img.src = URL.createObjectURL(file);
  });
}
function previewOn(inputId, imgId) {
  $(inputId).onchange = e => {
    const f = e.target.files[0], p = $(imgId);
    if (f) { p.src = URL.createObjectURL(f); p.hidden = false; } else p.hidden = true;
  };
}

/* ---------- SCANNER ---------- */
function openScanner(onCode) {
  if (!window.Html5Qrcode) return toast('Scanner not available – choose the item from the list', 1);
  openModal(`
    <div class="mh"><h3>Scan QR label</h3><button class="x" onclick="closeModal()">✕</button></div>
    <div id="qrReader"></div>
    <div class="hint" style="margin:10px 0 0">Point the camera at the QR code on the label.</div>`);
  SCN = new Html5Qrcode('qrReader');
  SCN.start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 230, height: 230 } },
    txt => { closeModal(); onCode(txt); }, () => {})
    .catch(err => { toast('Camera error: ' + err, 1); closeModal(); });
}
function stopScanner() {
  if (!SCN) return;
  const s = SCN; SCN = null;
  s.stop().then(() => s.clear()).catch(() => {});
}

/* ---------- LOAD ---------- */
function applyInv(inv) {
  S.items = inv.items; S.secs = inv.sections || []; S.reasons = inv.reasons || [];
  S.hasLost = inv.hasLost; S.hasPrice = inv.hasPrice; S.hasSection = inv.hasSection; S.hasTrf = inv.hasTrf;
  S.hasCode = inv.hasCode; S.hasMin = inv.hasMin; S.codePrefix = inv.codePrefix || 'KU-';
  S.low = inv.lowStock; S.qrKey = inv.qrKey || S.qrKey || '';
  if (S.role !== 'qr') S.me = inv.me || '';
  if (S.sec && S.secs.indexOf(S.sec) < 0) S.sec = '';
  buildGroups();
}
async function load() {
  if (S.role === 'qr') return;
  if (!ls('inv_pin')) { showLogin(); return; }
  S.role = ls('inv_role') || S.role || 'staff';
  applyRole();
  $('#sub').textContent = 'Loading...';
  try {
    let inv, log = [], cl = [];
    if (isSpv()) [inv, log, cl] = await Promise.all([get('list'), get('log', { limit: 3000 }), get('closing')]);
    else inv = await get('list');
    if (inv.role === 'qr') { logout(true); return; }
    if (inv.role && inv.role !== S.role) { S.role = inv.role; ls('inv_role', inv.role); }
    applyInv(inv);
    S.log = log; S.closings = cl;
    fillSecs(); fillReasons(); fillItems();
    if (isSpv()) {
      renderChips(); renderDash(); renderList(); renderHis(); renderCloseInfo(); renderRecap();
      if (!$('#lab').hidden) renderLabels();
      if (!$('#opn').hidden) renderOpname();
    }
    applyRole();
    $('#sub').textContent = 'Updated ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    handleDeepLink();
  } catch (e) { toast(e.message, 1); $('#sub').textContent = 'Failed to load'; }
}

function handleDeepLink() {
  if (!DEEP || (!DEEP.code && !DEEP.item)) return;
  const d = DEEP; DEEP = null;
  try { history.replaceState(null, '', APP_URL); } catch (e) {}
  const g = findGroup(d);
  if (!g) return toast('Item ' + (d.code || d.item) + ' not found', 1);
  if (isSpv()) { tab('inv'); openItem(g.id); }
  else selectForReport(g, d.sec);
}

function buildGroups() {
  const m = {}, order = [];
  S.items.forEach(r => {
    const k = nk(r.item);
    if (!m[k]) { m[k] = { item: r.item, code: '', no: r.no, photo: '', harga: 0, remarks: '', rows: [], total: 0, broken: 0, lost: 0 }; order.push(m[k]); }
    const g = m[k];
    g.rows.push(r); g.total += r.closing; g.broken += r.broken; g.lost += r.lost;
    if (!g.code && r.code) g.code = r.code;
    if (!g.photo && r.photo) g.photo = r.photo;
    if (!g.harga && r.harga) g.harga = r.harga;
    if (!g.remarks && r.remarks) g.remarks = r.remarks;
  });
  S.groups = order;
  S.groups.forEach((g, i) => { g.id = i; g.rows = sortSec(g.rows); });
}

/* ---------- QR MODE: detail item + Broken/Lost, PIN after tapping ---------- */
async function startQr() {
  S.role = 'qr';
  $('#login').hidden = true; $('#nav').hidden = true; $('#hbtns').hidden = true;
  $('#roleTag').textContent = 'Report';
  $('#sub').textContent = 'Loading...';
  document.querySelectorAll('main section').forEach(s => s.hidden = s.id !== 'qrv');
  try {
    const inv = await get('list', {}, QR.key);
    applyInv(inv);
    const d = DEEP || {}; DEEP = null;
    const g = findGroup(d);
    if (!g) { qrMessage('Item not found', 'This label is not linked to an item. Please inform your supervisor.'); return; }
    QR.g = g;
    QR.fixedSec = (d.sec && g.rows.some(r => r.section === d.sec)) ? d.sec : '';
    qrRender(true);
    $('#sub').textContent = 'Lost · Breakage report';
  } catch (e) {
    qrMessage('Cannot open this label', e.message === 'Wrong PIN'
      ? 'This QR label is no longer valid. Please ask your supervisor for a new label.' : e.message);
  }
}
function qrMessage(title, text) {
  $('#qrCard').hidden = true;
  $('#qDone').hidden = false;
  $('#qDone').innerHTML = `<h3>${esc(title)}</h3><div class="meta">${esc(text)}</div>`;
  $('#sub').textContent = '';
}
function qrRow() {
  const rows = QR.g.rows;
  if (!S.hasSection) return rows[0];
  const s = QR.fixedSec || (rows.length === 1 ? rows[0].section : $('#qSec').value);
  return rows.find(r => r.section === s) || null;
}
function qrRender(first) {
  const g = QR.g, rows = g.rows, sel = $('#qSec');
  if (!S.hasSection || QR.fixedSec || rows.length === 1) {
    $('#qSecWrap').hidden = true;
  } else if (first || !sel.options.length) {
    $('#qSecWrap').hidden = false;
    sel.innerHTML = '<option value="">— choose section —</option>' + rows.map(r => `<option>${esc(r.section)}</option>`).join('');
  }
  qrInfo();
  qrShowPick();
}
function qrInfo() {
  const g = QR.g, r = qrRow(), rows = g.rows;
  const T = k => rows.reduce((a, x) => a + (x[k] || 0), 0);
  const o = r || { awal: T('awal'), add: T('add'), trf: T('trf'), broken: T('broken'), lost: T('lost'), closing: T('closing') };
  const low = r && isLow(r);
  const multi = S.hasSection && rows.length > 0;

  const stats = `
    <div class="qstats">
      <div><small>Opening</small><b>${o.awal}</b></div>
      <div class="g"><small>Add</small><b>+${o.add}</b></div>
      ${S.hasSection ? `<div class="bl"><small>Transfer</small><b>${sgn(o.trf)}</b></div>` : ''}
      <div class="r"><small>Broken</small><b>−${o.broken}</b></div>
      ${S.hasLost ? `<div class="a"><small>Lost</small><b>−${o.lost}</b></div>` : ''}
      <div><small>Current</small><b class="${low ? 'neg' : ''}">${o.closing}</b></div>
    </div>`;

  const table = multi ? `
    <h4 style="margin:4px 0 6px;text-align:left">Stock per section</h4>
    <div class="tbl-wrap" style="margin-bottom:12px"><table class="tbl">
      <thead><tr><th>Section</th><th class="n">Open</th><th class="n">Add</th><th class="n">Trf</th><th class="n">Broken</th>${S.hasLost ? '<th class="n">Lost</th>' : ''}<th class="n">Stock</th></tr></thead>
      <tbody>${rows.map(x => `<tr class="${r && x.row === r.row ? 'cur' : ''}">
        <td>${esc(x.section || '-')}${r && x.row === r.row ? ' ◀' : ''}</td>
        <td class="n">${x.awal}</td><td class="n">${x.add}</td><td class="n">${sgn(x.trf)}</td>
        <td class="n">${x.broken}</td>${S.hasLost ? `<td class="n">${x.lost}</td>` : ''}
        <td class="n"><b class="${isLow(x) ? 'neg' : ''}">${x.closing}</b></td></tr>`).join('')}</tbody>
      ${rows.length > 1 ? `<tfoot><tr><td>Total</td><td class="n">${T('awal')}</td><td class="n">${T('add')}</td><td class="n">${sgn(T('trf'))}</td><td class="n">${T('broken')}</td>${S.hasLost ? `<td class="n">${T('lost')}</td>` : ''}<td class="n">${T('closing')}</td></tr></tfoot>` : ''}
    </table></div>` : '';

  $('#qItem').innerHTML = `
    ${g.photo ? `<img class="big" src="${esc(g.photo)}" referrerpolicy="no-referrer" onerror="this.remove()">` : ''}
    <div class="qitem">
      ${g.code ? `<div>${codeTag(g.code)}</div>` : ''}
      <h2>${esc(g.item)}</h2>
      ${g.remarks ? `<div class="meta">${esc(g.remarks)}</div>` : ''}
    </div>
    <div class="qhero">
      <div>
        <small>${r ? (r.section ? esc(r.section) : 'Current stock') : 'Total all sections – choose section below'}</small>
        <div class="meta">${r ? 'Min stock ' + minOf(r) + (low ? ' · <b class="neg">below minimum</b>' : '') : ''}</div>
      </div>
      <b class="n ${low ? 'low' : ''}">${o.closing}</b>
    </div>
    ${stats}
    ${table}`;
}
function qrShowPick() {
  QR.pin = ''; QR.name = '';
  $('#qForm').hidden = true;
  $('#qPick').hidden = false;
  $('#qSec').disabled = false;
}
function qrStart(t) {
  const r = qrRow();
  if (!r) return toast('Choose the section first', 1);
  if (r.closing <= 0) return toast('Stock is 0 – nothing to report. Inform your supervisor.', 1);
  askPin(t, (pin, name) => {
    QR.pin = pin; QR.name = name; QR.type = t;
    $('#qPick').hidden = true;
    $('#qSec').disabled = true;
    $('#qForm').hidden = false;
    $('#qBanner').className = 'tbanner ' + t;
    $('#qBanner').textContent = t === 'LOST' ? 'Report LOST' : 'Report BROKEN';
    $('#qWho').innerHTML = whoHtml(name);
    const btn = $('#qSubmit');
    btn.textContent = t === 'LOST' ? 'Report lost' : 'Report broken';
    btn.className = 'btn full lg ' + (t === 'LOST' ? 'amb' : 'red');
    const s = $('#qReason');
    const list = S.reasons.filter(x => x.type === 'ALL' || x.type === t);
    s.innerHTML = '<option value="">— choose cause —</option>' + list.map(x => `<option>${esc(x.name)}</option>`).join('');
    $('#qReasonWrap').hidden = !list.length;
    $('#qQty').value = ''; $('#qNote').value = ''; $('#qPhoto').value = ''; $('#qPrev').hidden = true;
    setTimeout(() => $('#qQty').focus(), 150);
  });
}
function askPin(t, cb) {
  openModal(`
    <div class="mh"><h3>Enter your PIN</h3><button class="x" onclick="closeModal()">✕</button></div>
    <div class="meta" style="margin-bottom:10px">To report <b>${t === 'LOST' ? 'LOST' : 'BROKEN'}</b>, enter your personal staff PIN. The report will be recorded under your name.</div>
    <input id="pinIn" class="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="••••">
    <button type="button" class="btn full lg" id="pinBtn" style="margin-top:12px">Continue</button>
    <div class="hint" style="margin:12px 0 0">Forgot your PIN? Ask your supervisor.</div>`);
  const go = async () => {
    const pin = $('#pinIn').value.trim();
    if (!pin) return toast('Enter your PIN', 1);

/* ---------- DASHBOARD ---------- */
function renderDash() {
  const mk = thisMonth(), mn = monthLabel(mk);
  const m = S.log.filter(l => l.ts.startsWith(mk));
  const sum = t => m.filter(l => l.type === t).reduce((a, l) => a + l.qty, 0);
  const loss = m.filter(isLoss);
  const lossTotal = loss.reduce((a, l) => a + lossVal(l), 0);
  const stock = S.items.reduce((a, i) => a + i.closing, 0);
  const low = S.items.filter(isLow).sort((a, b) => (a.closing - minOf(a)) - (b.closing - minOf(b)));
  const key = S.hasPrice ? 'v' : 'q';
  const agg = (arr, kf) => {
    const o = {};
    arr.forEach(l => { const k = kf(l); const a = o[k] || (o[k] = { q: 0, v: 0 }); a.q += l.qty; a.v += lossVal(l); });
    return Object.entries(o).sort((a, b) => b[1][key] - a[1][key]);
  };
  const top = agg(loss, l => l.item).slice(0, 5);
  const causes = agg(loss.filter(l => l.reason), l => l.reason).slice(0, 5);
  const people = agg(loss.filter(l => l.by), l => l.by).slice(0, 5);
  const line = ([n, o], code) => `<div class="row"><span>${code ? codeTag(codeOf(n)) : ''}${esc(n)}</span><span><b>${o.q}</b> pcs${S.hasPrice ? ' · ' + rp(o.v) : ''}</span></div>`;

  let secHtml = '';
  if (S.hasSection) {
    const rows = S.secs.map(s => {
      const ls_ = loss.filter(l => l.loc === s);
      return {
        s, stock: S.items.filter(r => r.section === s).reduce((a, r) => a + r.closing, 0),
        broken: ls_.filter(l => l.type === 'BROKEN').reduce((a, l) => a + l.qty, 0),
        lost: ls_.filter(l => l.type === 'LOST').reduce((a, l) => a + l.qty, 0),
        v: ls_.reduce((a, l) => a + lossVal(l), 0)
      };
    });
    secHtml = `<div class="card"><h3>By section · ${mn}</h3><div class="tbl-wrap" style="margin:0"><table class="tbl">
      <thead><tr><th>Section</th><th class="n">Stock</th><th class="n">Broken</th><th class="n">Lost</th>${S.hasPrice ? '<th class="n">Loss value</th>' : ''}</tr></thead>
      <tbody>${rows.map(r => `<tr><td>${esc(r.s)}</td><td class="n">${r.stock}</td><td class="n">${r.broken}</td><td class="n">${r.lost}</td>${S.hasPrice ? `<td class="n">${rp(r.v)}</td>` : ''}</tr>`).join('')}</tbody>
    </table></div></div>`;
  }

  $('#dash').innerHTML = `
    <div class="stats">
      <div class="stat"><small>Items</small><b>${S.groups.length}</b></div>
      <div class="stat g"><small>Stock on hand</small><b>${stock}</b></div>
      <div class="stat r"><small>Broken · ${mn}</small><b>${sum('BROKEN')}</b></div>
      <div class="stat a"><small>Lost · ${mn}</small><b>${sum('LOST')}</b></div>
      ${S.hasPrice ? `<div class="stat r"><small>Loss value · ${mn}</small><b>${rp(lossTotal)}</b></div>` : ''}
      <div class="stat ${low.length ? 'r' : 'g'}"><small>Below minimum</small><b>${low.length}</b></div>
    </div>
    ${secHtml}
    <div class="card"><h3>Top causes · ${mn}</h3>
      ${causes.length ? causes.map(c => line(c, false)).join('') : '<p class="empty">No causes recorded this month</p>'}
    </div>
    <div class="card"><h3>Top broken / lost items · ${mn}</h3>
      ${top.length ? top.map(c => line(c, true)).join('') : '<p class="empty">Nothing reported this month</p>'}
    </div>
    <div class="card"><h3>Reports by staff · ${mn}</h3>
      ${people.length ? people.map(c => line(c, false)).join('') : '<p class="empty">No reports this month</p>'}
    </div>
    <div class="card"><h3>Below minimum stock</h3>
      ${low.length ? low.map(i => `<div class="row"><span>${codeTag(codeOf(i.item))}${esc(i.item)}${i.section ? ' · <span style="color:var(--mute)">' + esc(i.section) + '</span>' : ''}</span><span><b class="neg">${i.closing}</b> / min ${minOf(i)}</span></div>`).join('') : '<p class="empty">All items above minimum</p>'}
    </div>`;
}

function sortList(a, sort, stockKey) {
  if (sort === 'code') a.sort(byCode);
  if (sort === 'name') a.sort((x, y) => x.item.localeCompare(y.item));
  if (sort === 'low') a.sort((x, y) => x[stockKey] - y[stockKey]);
  if (sort === 'broken') a.sort((x, y) => (y.broken + y.lost) - (x.broken + x.lost));
  if (sort === 'price') a.sort((x, y) => y.harga - x.harga);
  return a;
}

function renderList() {

    html = a.map(r => {

      return `<div class="item" onclick="openItem(${g.id})">${thumb(g.photo)}
        <div class="info"><b>${codeTag(r.code)}${esc(r.item)}</b>
          <div class="meta">Awal ${r.awal} · +${r.add}${r.trf ? ' · Trf ' + sgn(r.trf) : ''} · Broken ${r.broken}${S.hasLost ? ' · Lost ' + r.lost : ''} · Min ${minOf(r)}</div>

/* ---------- STOCK OPNAME ---------- */
function opKey() { return 'op_' + (OP.sec || 'all'); }
function opLoad() { try { OP.counts = JSON.parse(ls(opKey()) || '{}') || {}; } catch (e) { OP.counts = {}; } }
function opSave() { ls(opKey(), JSON.stringify(OP.counts)); }
function opRows() {
  return S.items.filter(r => !S.hasSection || r.section === OP.sec)
    .map(r => Object.assign({}, r, { code: codeOf(r.item) })).sort(byCode);
}
function opHas(k) { const v = OP.counts[k]; return v !== undefined && v !== ''; }

function renderOpname() {
  const secNow = S.hasSection ? ($('#oSec').value || S.secs[0] || '') : '';
  if (OP.sec !== secNow) { OP.sec = secNow; opLoad(); }
  if (S.hasSection) $('#oSec').value = OP.sec;
  if (!$('#oBy').value) $('#oBy').value = ls('inv_by') || '';
  const q = nk(scanCode($('#oQ').value));
  const rows = opRows().filter(r => !q || nk(r.item).includes(q) || nk(r.code).includes(q));
  $('#oList').innerHTML = rows.map(r => {
    const k = nk(r.item);
    return `<div class="orow" data-k="${esc(k)}">
      <div class="info"><b>${codeTag(r.code)}${esc(r.item)}</b><div class="meta" data-m="1"></div></div>
      <input class="ocnt" type="number" min="0" step="1" inputmode="numeric" placeholder="Count" data-k="${esc(k)}" value="${opHas(k) ? esc(OP.counts[k]) : ''}">
    </div>`;
  }).join('') || '<p class="empty">No items</p>';
  document.querySelectorAll('#oList .ocnt').forEach(el => {
    el.oninput = () => {
      const k = el.dataset.k;
      if (el.value === '') delete OP.counts[k]; else OP.counts[k] = el.value;
      opSave(); opRowState(k); opSummary();
    };
    opRowState(el.dataset.k);
  });
  opSummary();
}
function opRowState(k) {
  const row = document.querySelector(`#oList .orow[data-k="${CSS.escape(k)}"]`); if (!row) return;
  const r = opRows().find(x => nk(x.item) === k); if (!r) return;
  const meta = row.querySelector('[data-m]');
  row.classList.remove('ok', 'diff');
  let html = `System: <b>${r.closing}</b>`;
  if (opHas(k)) {
    const d = +OP.counts[k] - r.closing;
    row.classList.add(d === 0 ? 'ok' : 'diff');
    html += d === 0 ? ' · <span class="pos">match</span>'
      : ` · <b class="${d < 0 ? 'neg' : 'pos'}">${sgn(d)}</b>${S.hasPrice && r.harga ? ` <span class="${d < 0 ? 'neg' : 'pos'}">(${rp(d * r.harga)})</span>` : ''}`;
  }
  meta.innerHTML = html;
}
function opSummary() {
  const rows = opRows();
  let counted = 0, diff = 0, short = 0, over = 0, val = 0;
  rows.forEach(r => {
    const k = nk(r.item); if (!opHas(k)) return;
    counted++;
    const d = +OP.counts[k] - r.closing;
    if (d) { diff++; if (d < 0) short -= d; else over += d; val += d * (r.harga || 0); }
  });
  $('#oSum').innerHTML = `${S.hasSection ? '<b>' + esc(OP.sec) + '</b> · ' : ''}Counted <b>${counted}</b> / ${rows.length} · Variance items <b>${diff}</b> · Short <b class="neg">${short}</b> · Over <b class="pos">${over}</b>${S.hasPrice ? ' · Value <b class="' + (val < 0 ? 'neg' : 'pos') + '">' + rp(val) + '</b>' : ''}`;
}
function printCountSheet() {
  const rows = opRows(), blind = $('#oBlind').checked, K = S.hasCode;
  $('#opRpt').innerHTML = `

/* ---------- QR LABELS ---------- */
function qrSvg(text) {
  const qr = qrcode(0, 'M');
  qr.addData(text);
  qr.make();
  const n = qr.getModuleCount(), m = 2;
  let d = '';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) d += `M${c + m} ${r + m}h1v1h-1z`;
  return `<svg class="lqr" viewBox="0 0 ${n + 2 * m} ${n + 2 * m}" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
}
function qrText(x) {
  const g = x.g;
  if ($('#lMode').value === 'code') return g.code || g.item;
  let q = g.code ? 'code=' + encodeURIComponent(g.code) : 'item=' + encodeURIComponent(g.item);
  if (x.sec) q += '&sec=' + encodeURIComponent(x.sec);
  if (S.qrKey) q += '&k=' + encodeURIComponent(S.qrKey);
  return APP_URL + '?' + q;
}
function openLabels(only) {
  closeModal();
  LBL.only = (only === undefined || only === null) ? null : only;
  LBL.skip.clear();
  if (LBL.only !== null) { $('#lQ').value = ''; $('#lSec').value = ''; }
  tab('lab');
}
function labelList() {
  const sec = $('#lSec').value, q = nk($('#lQ').value);
  let list;
  if (LBL.only !== null) {
    const g = S.groups[LBL.only];
    list = g ? [{ g, sec: '' }] : [];
  } else if (sec) {
    list = S.items.filter(r => r.section === sec).map(r => ({ g: groupOf(r.item), sec }));
  } else {
    list = S.groups.map(g => ({ g, sec: '' }));
  }
  list = list.filter(x => x.g && (nk(x.g.item).includes(q) || nk(x.g.code).includes(q)));
  list.sort((a, b) => byCode(a.g, b.g));
  return list.filter(x => !LBL.skip.has(x.g.item + '|' + x.sec));
}
function labelHtml(x, svg, size) {
  const g = x.g;
  const photo = `<div class="lph">${g.photo ? `<img src="${esc(g.photo)}" referrerpolicy="no-referrer" onerror="this.remove()">` : '🍽'}</div>`;
  if (size === 'qm' || size === 'qs') {
    return `
      <div class="qh"><b>KITCHEN UTENSILS</b><span>${esc(x.sec || 'Scan to report')}</span></div>
      <div class="qbody">
        <div class="qqr">${svg}</div>
        ${g.code ? `<div class="qcode">${esc(g.code)}</div>` : '<div class="qcode none">No code yet</div>'}
        <div class="qfoot">${photo}<div class="qname">${esc(g.item)}</div></div>
      </div>`;
  }
  return `
    <div class="lqrw">${svg}</div>
    <div class="lbody">
      ${size !== 's' ? photo : ''}
      <div class="lname">${esc(g.item)}</div>
      ${x.sec ? `<div class="lsec">${esc(x.sec)}</div>` : ''}
      ${g.code ? `<div class="lcode">${esc(g.code)}</div>` : '<div class="lcode none">No code yet</div>'}
    </div>`;
}
function renderLabels() {
  if (!window.qrcode) { toast('QR library not loaded, check internet connection', 1); return; }
  const size = $('#lSize').value;
  const isCard = size === 'qm' || size === 'qs';
  const copies = Math.max(1, Math.min(20, Math.round(+$('#lCopies').value || 1)));
  const list = labelList();
  LBL.cur = list;
  let html = '';
  list.forEach((x, i) => {
    let svg = '';
    try { svg = qrSvg(qrText(x)); } catch (e) { svg = '<div class="lcode none">QR error</div>'; }
    const inner = labelHtml(x, svg, size);
    for (let c = 0; c < copies; c++) {
      html += `<div class="lbl${isCard ? ' qc' : ''}">
        ${c === 0 ? `<button class="lx noprint" title="Hide this item" onclick="skipLabel(${i})">✕</button>` : ''}
        ${inner}
      </div>`;
    }
  });
  const box = $('#labels');
  box.className = 'labels l' + size;
  box.innerHTML = html || '<p class="empty noprint">No items to print</p>';
  const noCode = list.filter(x => !x.g.code).length;
  let info = `${list.length} item${list.length === 1 ? '' : 's'} × ${copies} = <b>${list.length * copies}</b> labels`;
  if (noCode) info += ` · <span class="neg">${noCode} without code</span>`;
  if ($('#lMode').value === 'link' && !S.qrKey) info += ` · <span class="neg">QR_KEY not set in Code.gs</span>`;
  if (LBL.skip.size) info += ` · ${LBL.skip.size} hidden <button class="link" onclick="LBL.skip.clear();renderLabels()">show</button>`;
  if (LBL.only !== null) info += ` · <button class="link" onclick="LBL.only=null;renderLabels()">show all items</button>`;
  $('#lInfo').innerHTML = info;
}
function skipLabel(i) {

/* ---------- RECAP ---------- */
const SIGS = [['s1', 'Prepared by'], ['s2', 'Checked by'], ['s3', 'Approved by']];
function sigs() { return SIGS.map(([k, label]) => ({ label, name: $('#' + k + 'n').value.trim(), role: $('#' + k + 'r').value.trim() })); }

function recapData() {
  const m = $('#cMonth').value || thisMonth(), sec = S.hasSection ? $('#cSec').value : '';
  const closed = S.closings.some(c => c.month === m);
  const TYPES = ['ADD', 'BROKEN', 'LOST', 'TRANSFER IN', 'TRANSFER OUT'];
  const logs = S.log.filter(l => l.ts.startsWith(m) && TYPES.includes(l.type) && (!sec || l.loc === sec));
  const agg = {}, order = [];
  const A = (name, no, price) => {
    const k = nk(name);
    if (!agg[k]) { agg[k] = { no: no || '', code: codeOf(name), item: name, price: price || 0, opening: 0, add: 0, trf: 0, broken: 0, lost: 0, value: 0, stock: 0 }; order.push(agg[k]); }
    if (!agg[k].price && price) agg[k].price = price;
    return agg[k];
  };
  if (closed) S.closings.filter(c => c.month === m && (!sec || c.section === sec)).forEach(c => { const a = A(c.item, c.no, c.harga); a.opening += c.awal; a.stock += c.closing; });
  else S.items.filter(r => !sec || r.section === sec).forEach(r => { const a = A(r.item, r.no, r.harga); a.opening += r.awal; a.stock += r.closing; });
  logs.forEach(l => {
    const a = A(l.item, '', l.price || priceOf(l.item));
    if (l.type === 'ADD') a.add += l.qty;
    else if (l.type === 'TRANSFER IN') a.trf += l.qty;
    else if (l.type === 'TRANSFER OUT') a.trf -= l.qty;
    else { a[l.type === 'BROKEN' ? 'broken' : 'lost'] += l.qty; a.value += lossVal(l); }
  });
  let rows = order;
  if (sec) rows = rows.filter(r => r.opening || r.stock || r.add || r.trf || r.broken || r.lost);
  if (S.hasCode) rows = [...rows].sort(byCode);

  const secList = S.hasSection ? (sec ? [sec] : S.secs) : [];
  const bySec = secList.map(s => {
    const o = { sec: s, opening: 0, add: 0, tin: 0, tout: 0, broken: 0, lost: 0, value: 0, stock: 0 };
    if (closed) S.closings.filter(c => c.month === m && c.section === s).forEach(c => { o.opening += c.awal; o.stock += c.closing; });
    else S.items.filter(r => r.section === s).forEach(r => { o.opening += r.awal; o.stock += r.closing; });
    S.log.filter(l => l.ts.startsWith(m) && l.loc === s).forEach(l => {
      if (l.type === 'ADD') o.add += l.qty;
      else if (l.type === 'TRANSFER IN') o.tin += l.qty;
      else if (l.type === 'TRANSFER OUT') o.tout += l.qty;
      else if (isLoss(l)) { o[l.type === 'BROKEN' ? 'broken' : 'lost'] += l.qty; o.value += lossVal(l); }
    });
    return o;
  });
  const cz = {};
  logs.filter(isLoss).forEach(l => {
    const k = l.reason || '(not specified)';
    const o = cz[k] || (cz[k] = { cause: k, broken: 0, lost: 0, value: 0 });
    o[l.type === 'BROKEN' ? 'broken' : 'lost'] += l.qty; o.value += lossVal(l);
  });
  const t = rows.reduce((a, r) => {
    ['opening', 'add', 'trf', 'broken', 'lost', 'value', 'stock'].forEach(k => a[k] += r[k]); return a;
  }, { opening: 0, add: 0, trf: 0, broken: 0, lost: 0, value: 0, stock: 0 });
  return {
    m, sec, closed, rows, bySec, t,
    causes: Object.values(cz).sort((a, b) => b.value - a.value || (b.broken + b.lost) - (a.broken + a.lost)),
    incidents: logs.filter(isLoss).slice().reverse(),
    transfers: logs.filter(l => l.type === 'TRANSFER OUT' || (sec && l.type === 'TRANSFER IN')).slice().reverse()
  };
}

function renderRecap() {
  const d = recapData(), P = S.hasPrice, C = d.closed, T = !!d.sec, K = S.hasCode, sg = sigs();
  let no = 1;
  const cols = 7 + (P ? 2 : 0) + (T ? 1 : 0) + (K ? 1 : 0);
  const head = `<th>No</th>${K ? '<th>Code</th>' : ''}<th>Item</th>${P ? '<th class="n">Price</th>' : ''}<th class="n">Opening</th><th class="n">Added</th>${T ? '<th class="n">Transfer</th>' : ''}<th class="n">Broken</th><th class="n">Lost</th>${P ? '<th class="n">Loss value</th>' : ''}<th class="n">${C ? 'Closing stock' : 'Current stock'}</th>`;
  const body = d.rows.map((r, i) => `<tr><td>${i + 1}</td>${K ? `<td>${esc(r.code)}</td>` : ''}<td>${esc(r.item)}</td>${P ? `<td class="n">${r.price ? rp(r.price) : '-'}</td>` : ''}<td class="n">${r.opening}</td><td class="n">${r.add}</td>${T ? `<td class="n">${sgn(r.trf)}</td>` : ''}<td class="n">${r.broken}</td><td class="n">${r.lost}</td>${P ? `<td class="n">${rp(r.value)}</td>` : ''}<td class="n">${r.stock}</td></tr>`).join('');
  const foot = `<tr><td></td>${K ? '<td></td>' : ''}<td>TOTAL</td>${P ? '<td></td>' : ''}<td class="n">${d.t.opening}</td><td class="n">${d.t.add}</td>${T ? `<td class="n">${sgn(d.t.trf)}</td>` : ''}<td class="n">${d.t.broken}</td><td class="n">${d.t.lost}</td>${P ? `<td class="n">${rp(d.t.value)}</td>` : ''}<td class="n">${d.t.stock}</td></tr>`;

  const secTbl = d.bySec.length ? `<h4>${++no}. By section</h4>
    <div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>Section</th><th class="n">Opening</th><th class="n">Added</th><th class="n">Trf in</th><th class="n">Trf out</th><th class="n">Broken</th><th class="n">Lost</th>${P ? '<th class="n">Loss value</th>' : ''}<th class="n">${C ? 'Closing' : 'Current'}</th></tr></thead>
      <tbody>${d.bySec.map(s => `<tr><td>${esc(s.sec)}</td><td class="n">${s.opening}</td><td class="n">${s.add}</td><td class="n">${s.tin}</td><td class="n">${s.tout}</td><td class="n">${s.broken}</td><td class="n">${s.lost}</td>${P ? `<td class="n">${rp(s.value)}</td>` : ''}<td class="n">${s.stock}</td></tr>`).join('')}</tbody>
    </table></div>` : '';

  const causeTbl = `<h4>${++no}. Loss by cause</h4>
    <div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>Cause</th><th class="n">Broken</th><th class="n">Lost</th>${P ? '<th class="n">Loss value</th>' : ''}</tr></thead>
      <tbody>${d.causes.map(c => `<tr><td>${esc(c.cause)}</td><td class="n">${c.broken}</td><td class="n">${c.lost}</td>${P ? `<td class="n">${rp(c.value)}</td>` : ''}</tr>`).join('') || `<tr><td colspan="4" class="empty">No breakage or loss this period</td></tr>`}</tbody>
    </table></div>`;

  const incTbl = `<h4>${++no}. Incident detail (broken / lost)</h4>
    <div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>Date</th><th>Type</th>${K ? '<th>Code</th>' : ''}<th>Item</th>${S.hasSection ? '<th>Section</th>' : ''}<th class="n">Qty</th>${P ? '<th class="n">Value</th>' : ''}<th>Cause</th><th>Reported by</th><th>Note</th></tr></thead>
      <tbody>${d.incidents.map(l => `<tr><td>${esc(l.ts)}</td><td>${l.type}</td>${K ? `<td>${esc(codeOf(l.item))}</td>` : ''}<td>${esc(l.item)}</td>${S.hasSection ? `<td>${esc(l.loc || '-')}</td>` : ''}<td class="n">${l.qty}</td>${P ? `<td class="n">${rp(lossVal(l))}</td>` : ''}<td>${esc(l.reason || '-')}</td><td>${esc(l.by || '-')}</td><td>${esc(l.note)}</td></tr>`).join('') || `<tr><td colspan="10" class="empty">No incidents</td></tr>`}</tbody>
    </table></div>`;

  const trfTbl = S.hasSection ? `<h4>${++no}. Transfers</h4>
    <div class="tbl-wrap"><table class="tbl">
      <thead><tr><th>Date</th><th>Type</th>${K ? '<th>Code</th>' : ''}<th>Item</th><th>Section</th><th class="n">Qty</th><th>Detail</th><th>By</th></tr></thead>
      <tbody>${d.transfers.map(l => `<tr><td>${esc(l.ts)}</td><td>${l.type === 'TRANSFER IN' ? 'IN' : 'OUT'}</td>${K ? `<td>${esc(codeOf(l.item))}</td>` : ''}<td>${esc(l.item)}</td><td>${esc(l.loc)}</td><td class="n">${l.qty}</td><td>${esc(l.note)}</td><td>${esc(l.by || '-')}</td></tr>`).join('') || `<tr><td colspan="8" class="empty">No transfers</td></tr>`}</tbody>
    </table></div>` : '';

  $('#rpt').innerHTML = `
    <div class="rh">
      <h2>Kitchen Utensils – Lost &amp; Breakage Report</h2>
      <div>Period: <b>${monthLabel(d.m)}</b>${S.hasSection ? ` · Section: <b>${esc(d.sec || 'All sections')}</b>` : ''}</div>
      <div>${C ? 'Month closed' : 'Month not closed yet – stock shown is current stock'} · Generated ${new Date().toLocaleString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' })}</div>
    </div>
    <div class="rsum">
      <div><small>Added</small><b>${d.t.add}</b></div>
      <div><small>Broken</small><b>${d.t.broken}</b></div>
      <div><small>Lost</small><b>${d.t.lost}</b></div>
      <div><small>${P ? 'Loss value' : 'Total loss'}</small><b>${P ? rp(d.t.value) : d.t.broken + d.t.lost}</b></div>
    </div>
    <h4>1. Summary per item${d.sec ? ' – ' + esc(d.sec) : (S.hasSection ? ' (all sections combined)' : '')}</h4>
    <div class="tbl-wrap"><table class="tbl">
      <thead><tr>${head}</tr></thead>
      <tbody>${body || `<tr><td colspan="${cols}" class="empty">No data</td></tr>`}</tbody>
      <tfoot>${foot}</tfoot>
    </table></div>
    ${secTbl}${causeTbl}${incTbl}${trfTbl}
    <div class="sigs">${sg.map(s => `<div>${s.label}<div class="ln"></div><b>${esc(s.name) || '&nbsp;'}</b><br><span style="color:var(--mute)">${esc(s.role) || '&nbsp;'}</span></div>`).join('')}</div>`;
}

function downloadXls() {
  if (!window.XLSX) return toast('Excel library not loaded, check internet connection', 1);
  const d = recapData(), P = S.hasPrice, C = d.closed, T = !!d.sec, K = S.hasCode, sg = sigs();
  const head = [['KITCHEN UTENSILS - LOST & BREAKAGE REPORT'], ['Period', monthLabel(d.m)],
    ['Section', d.sec || (S.hasSection ? 'All sections' : '-')],
    ['Status', C ? 'Month closed' : 'Month not closed - stock is current stock'], []];

  const h1 = ['NO', ...(K ? ['CODE'] : []), 'ITEM', ...(P ? ['PRICE'] : []), 'OPENING', 'ADDED', ...(T ? ['TRANSFER'] : []), 'BROKEN', 'LOST', ...(P ? ['LOSS VALUE'] : []), C ? 'CLOSING STOCK' : 'CURRENT STOCK'];
  const s1 = head.concat([h1]);
  d.rows.forEach((r, i) => s1.push([i + 1, ...(K ? [r.code] : []), r.item, ...(P ? [r.price] : []), r.opening, r.add, ...(T ? [r.trf] : []), r.broken, r.lost, ...(P ? [r.value] : []), r.stock]));
  s1.push(['', ...(K ? [''] : []), 'TOTAL', ...(P ? [''] : []), d.t.opening, d.t.add, ...(T ? [d.t.trf] : []), d.t.broken, d.t.lost, ...(P ? [d.t.value] : []), d.t.stock]);
  s1.push([], [], [sg[0].label, '', '', sg[1].label, '', '', sg[2].label], [], [], [],
    [sg[0].name, '', '', sg[1].name, '', '', sg[2].name], [sg[0].role, '', '', sg[1].role, '', '', sg[2].role]);

  const wb = XLSX.utils.book_new();
  const add = (aoa, name, cols) => { const ws = XLSX.utils.aoa_to_sheet(aoa); ws['!cols'] = cols.map(w => ({ wch: w })); XLSX.utils.book_append_sheet(wb, ws, name); };
  add(s1, 'Summary', [16, ...(K ? [10] : []), 32, 12, 10, 9, 10, 9, 9, 14, 14]);

  if (d.bySec.length) {
    const s2 = head.concat([['SECTION', 'OPENING', 'ADDED', 'TRF IN', 'TRF OUT', 'BROKEN', 'LOST', ...(P ? ['LOSS VALUE'] : []), C ? 'CLOSING' : 'CURRENT']]);
    d.bySec.forEach(s => s2.push([s.sec, s.opening, s.add, s.tin, s.tout, s.broken, s.lost, ...(P ? [s.value] : []), s.stock]));
    add(s2, 'By Section', [22, 10, 9, 9, 9, 9, 9, 14, 10]);
  }

  const sc = head.concat([['CAUSE', 'BROKEN', 'LOST', ...(P ? ['LOSS VALUE'] : [])]]);
  d.causes.forEach(c => sc.push([c.cause, c.broken, c.lost, ...(P ? [c.value] : [])]));
  add(sc, 'Causes', [32, 10, 10, 14]);

  const s3 = head.concat([['DATE', 'TYPE', ...(K ? ['CODE'] : []), 'ITEM', ...(S.hasSection ? ['SECTION'] : []), 'QTY', ...(P ? ['PRICE', 'VALUE'] : []), 'CAUSE', 'REPORTED BY', 'NOTE']]);
  d.incidents.forEach(l => s3.push([l.ts, l.type, ...(K ? [codeOf(l.item)] : []), l.item, ...(S.hasSection ? [l.loc] : []), l.qty, ...(P ? [l.price || priceOf(l.item), lossVal(l)] : []), l.reason, l.by, l.note]));
  add(s3, 'Incidents', [17, 9, ...(K ? [10] : []), 28, 18, 6, 12, 12, 26, 16, 30]);

  if (S.hasSection) {
    const s4 = head.concat([['DATE', 'TYPE', ...(K ? ['CODE'] : []), 'ITEM', 'SECTION', 'QTY', 'DETAIL', 'BY']]);
    d.transfers.forEach(l => s4.push([l.ts, l.type, ...(K ? [codeOf(l.item)] : []), l.item, l.loc, l.qty, l.note, l.by]));
    add(s4, 'Transfers', [17, 13, ...(K ? [10] : []), 28, 18, 6, 30, 16]);
  }
  XLSX.writeFile(wb, 'Lost-Breakage-' + d.m + (d.sec ? '-' + d.sec.replace(/\W+/g, '_') : '') + '.xlsx');
}

/* ---------- TABS & INIT ---------- */
function tab(t) {
  if (S.role === 'qr') t = 'qrv';
  else if (!isSpv() && t !== 'rep') t = 'rep';
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === t || (t === 'lab' && b.dataset.tab === 'inv')));
  document.querySelectorAll('main section').forEach(s => s.hidden = s.id !== t);
  if (t === 'rec') renderRecap();
  if (t === 'lab') renderLabels();
  if (t === 'opn') renderOpname();
  scrollTo(0, 0);
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => tab(b.dataset.tab));
$('#q').oninput = () => {
  const v = scanCode($('#q').value);
  if (v !== $('#q').value) $('#q').value = v;
  renderList();
};
$('#sort').onchange = renderList;
$('#hType').onchange = renderHis; $('#hMonth').onchange = renderHis; $('#hSec').onchange = renderHis;
$('#cMonth').onchange = renderRecap; $('#cSec').onchange = renderRecap;
SIGS.forEach(([k]) => ['n', 'r'].forEach(x => {
  const el = $('#' + k + x); el.value = ls('inv_' + k + x) || '';
  el.oninput = () => { ls('inv_' + k + x, el.value); renderRecap(); };
}));
$('#oSec').onchange = () => { $('#opRpt').hidden = true; renderOpname(); };
$('#oQ').oninput = () => {
  const v = scanCode($('#oQ').value);
  if (v !== $('#oQ').value) $('#oQ').value = v;
  renderOpname();
  const inputs = document.querySelectorAll('#oList .ocnt');
  if (inputs.length === 1 && v) inputs[0].focus();
};
$('#oScan').onclick = () => openScanner(txt => {
  const p = parseScan(txt);
  const g = findGroup(p);
  if (!g) return toast('Item not found: ' + (p.code || p.item || txt), 1);
  $('#oQ').value = g.code || g.item;
  renderOpname();
  const inputs = document.querySelectorAll('#oList .ocnt');
  if (inputs.length) inputs[0].focus();
  else toast(g.item + ' is not in ' + OP.sec, 1);
});
$('#oSheet').onclick = printCountSheet;
$('#oClear').onclick = () => { if (confirm('Clear all counts for this section?')) { OP.counts = {}; opSave(); renderOpname(); } };
$('#oSubmit').onclick = submitOpname;
$('#lblBtn').onclick = () => openLabels(null);
$('#lSec').onchange = () => { LBL.only = null; renderLabels(); };
$('#lQ').oninput = () => { LBL.only = null; renderLabels(); };
$('#lSize').onchange = renderLabels;
$('#lMode').onchange = renderLabels;
$('#lCopies').oninput = renderLabels;
$('#lPrint').onclick = printLabels;
$('#closeBtn').onclick = openClose;
$('#cPrint').onclick = () => { renderRecap(); window.print(); };
$('#cXls').onclick = downloadXls;
$('#refresh').onclick = load;
$('#logoutBtn').onclick = () => { if (confirm('Logout?')) logout(); };
$('#lgBtn').onclick = doLogin;
$('#lgPin').onkeydown = e => { if (e.key === 'Enter') doLogin(); };
$('#rBy').value = ls('inv_by') || '';
$('#hMonth').value = thisMonth();
$('#cMonth').value = thisMonth();

// START
if (QR.key && (DEEP.code || DEEP.item) && ls('inv_role') !== 'spv') {
  startQr();                                   // scan label: item detail + Broken/Lost, PIN after tapping
} else if (ls('inv_pin')) {
  S.role = ls('inv_role') || 'staff'; applyRole(); tab(isSpv() ? 'dash' : 'rep'); load();
} else {
  showLogin();
}
</script>
